<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Deck</title>
<style>
  :root{
    --bg:#0e1014; --ink:#eef1f5; --ink2:#c4cad3; --muted:#8b929c; --faint:#5b626c;
    --line:rgba(255,255,255,.08); --hair:rgba(255,255,255,.055);
    --accent:#ff7a1f; --accent-ink:#ffb680;
    --glass:rgba(255,255,255,.055);
    --ease:cubic-bezier(.32,.72,0,1); --easeio:cubic-bezier(.52,0,.22,1);
    --st-ns:#8b929c; --st-ip:#9dc0ff; --st-wf:#f0b45e; --st-bl:#ff9d9d; --st-dn:#7fd8a6;
    --dep:#7fd7c4;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{color:var(--ink);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 70% at 8% -8%, rgba(84,116,180,.22), transparent 52%),
      radial-gradient(80% 80% at 98% 2%, rgba(255,122,31,.13), transparent 50%),
      radial-gradient(130% 120% at 78% 116%, rgba(126,96,190,.18), transparent 55%),
      linear-gradient(160deg,#15181f 0%,#0e1014 55%,#0a0c0f 100%);
    background-attachment:fixed; height:100%; overflow:hidden; display:flex; flex-direction:column}
  html{height:100%}
  .split{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 402px;min-height:0;
    transition:grid-template-columns .38s var(--easeio)}
  .split.norail{grid-template-columns:minmax(0,1fr) 0px}
  .split.norail .pane-r{border-left-color:transparent;background-color:transparent}
  .split.norail .railinner{opacity:0;transform:translateX(22px)}
  .railbtn{align-self:center;height:24px;font-size:11.5px;gap:6px}
  .railbtn .gl2{display:flex;gap:2px}
  .railbtn .gl2 i{width:4px;height:11px;border-radius:1.5px;background:rgba(255,255,255,.3)}
  .railbtn .gl2 i:last-child{width:6px}
  .railbtn[data-on="1"] .gl2 i:last-child{background:var(--accent)}
  .pane{overflow-y:auto;overflow-x:hidden;min-width:0;min-height:0;scrollbar-width:thin}
  .pane::-webkit-scrollbar{width:9px}
  .pane::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:99px}
  .pane::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
  .pane-l{padding:0 40px 110px}
  .pane-r{padding:0;border-left:1px solid var(--line);background:rgba(255,255,255,.014);
    transition:border-color .38s var(--easeio),background-color .38s var(--easeio)}
  .railinner{width:402px;padding:0 34px 110px;
    transition:opacity .26s var(--easeio),transform .38s var(--easeio)}
  .railinner > div:first-child{padding-top:34px}
  .railinner > div + div{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
  @media(max-width:1100px){
    body{overflow:auto;display:block;height:auto}
    .split{display:block}
    .pane{overflow:visible}
    .pane-r{border-left:none;border-top:1px solid var(--line);margin-top:22px}
  }
  .num{font-variant-numeric:tabular-nums}

  /* ⛔ flex-wrap plus a MINIMUM height, not a fixed one: the bar carries five
     things now and a narrow window used to squeeze them until the title itself
     broke across two lines mid-phrase. Wrapping whole items and letting the bar
     grow keeps every one of them readable; at any width that fits, nothing
     wraps and the bar is the same 50px it always was. */
  .bar{flex:0 0 auto;z-index:40;display:flex;flex-wrap:wrap;align-items:baseline;gap:11px;padding:0 26px;min-height:50px;
    background:rgba(14,16,20,.6);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
    border-bottom:1px solid rgba(255,255,255,.06)}
  .bar h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;align-self:center;white-space:nowrap}
  .bar .biz{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em;align-self:center}
  .bar .stamp{margin-left:auto;margin-right:12px;font-size:10.5px;color:var(--faint);align-self:center;font-variant-numeric:tabular-nums}
  .bar .stamp.stale{color:var(--st-wf);font-weight:600}
  .bar .stamp.stale .nudge{color:var(--muted);font-weight:400;margin-left:7px}
  /* What the generator actually read, sitting beside the generation stamp: the
     same three numbers the build prints, plus the count of files it could not
     read at all. That last one only appears when it is not zero, and it is the
     reason this line exists on the page instead of only in a terminal. */
  .bar .counts{margin-right:12px;font-size:10.5px;color:var(--faint);align-self:center;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar .counts .warn{color:var(--st-wf);font-weight:600;margin-left:7px}

  .ctl{cursor:pointer;user-select:none;font-size:12px;color:var(--ink2);background:rgba(255,255,255,.05);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.10);
    border-radius:10px;height:27px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .ctl:hover{background:rgba(255,255,255,.09);color:var(--ink)}
  .ctl[data-on="1"]{background:rgba(255,122,31,.16);color:#ffdcb9;box-shadow:inset 0 0 0 1px rgba(255,146,72,.45)}

  .sp{flex:1}

  /* Milestone countdown card */
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .mcard{position:relative;overflow:hidden;padding:12px 13px 15px;border-radius:10px;min-width:0;
    background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
    cursor:pointer;transition:background .3s var(--ease)}
  .mcard:hover{background:rgba(255,255,255,.035)}
  .mc-tag{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.05em;
    color:var(--muted);text-transform:uppercase}
  .mc-tag .gk{width:7px;height:7px;flex:0 0 auto;border-radius:2px;border:1.5px solid rgba(255,255,255,.42)}
  .mcard .mc-title{font-size:12px;font-weight:600;line-height:1.3;margin:7px 0 8px;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
  .mc-cd{display:flex;align-items:baseline;gap:4px}
  .mc-cd b{font-size:24px;font-weight:300;line-height:1;letter-spacing:-.04em;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .mc-cd .u{font-size:10.5px;color:var(--muted)}
  .mcard .mc-date{font-size:10px;color:var(--faint);margin-top:3px}
  .mcard.next{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,146,72,.38)}
  .mcard.next .mc-tag{color:var(--accent-ink)}
  .mcard.next .mc-tag .gk{border-color:rgba(255,176,104,.7)}
  .mcard.next .mc-cd b{color:var(--accent)}
  .mcard.next .mc-date{color:var(--accent-ink)}
  .mcard.over{box-shadow:inset 0 0 0 1px rgba(255,140,140,.38)}
  .mcard.over .mc-cd b{color:var(--st-bl)}

  .emptyline{font-size:12px;color:var(--faint);line-height:1.75}

  /* ===== View tabs and control row ===== */
  .tabs{margin-top:34px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tab{cursor:pointer;user-select:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 15px;border-radius:12px;
    background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  .tab:hover{color:var(--ink2);background:rgba(255,255,255,.04)}
  .tab[data-on="1"]{color:var(--ink);background:var(--glass);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.12)}
  .tab .tc{font-size:10px;color:var(--faint);margin-left:6px;font-variant-numeric:tabular-nums}
  .ctlrow{margin-top:11px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 14px;border-radius:16px;
    background:rgba(255,255,255,.028);box-shadow:inset 0 0 0 1px rgba(255,255,255,.055)}
  .ctlrow .glab{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;margin-right:2px}

  /* ===== Swimlane view ===== */
  .boardwrap{position:relative;margin-top:18px}
  .board{overflow-x:auto;overflow-y:visible;padding:2px 0 6px}
  .axisbar{position:sticky;top:0;z-index:30;overflow:hidden;margin:0 -40px;padding:6px 40px 0;
    background:linear-gradient(180deg,rgba(13,15,19,.94) 0%,rgba(13,15,19,.88) 62%,rgba(13,15,19,0) 100%);
    backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
  .axisinner{position:relative;will-change:transform}
  .axistoday{position:absolute;top:16px;bottom:2px;width:2px;margin-left:-1px;border-radius:3px;
    background:linear-gradient(to bottom,rgba(205,222,255,.55),rgba(176,202,255,.12));
    box-shadow:0 0 12px 1px rgba(160,195,255,.28)}
  .axistoday span{position:absolute;left:6px;top:-2px;font-size:9px;font-weight:700;letter-spacing:.1em;
    color:rgba(205,222,255,.8);white-space:nowrap}
  .board::-webkit-scrollbar{height:8px}
  .board::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
  .inner{position:relative;min-width:100%}
  svg.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:6}
  .axishead{position:relative;height:18px}
  .axis{position:relative;height:30px;margin-left:var(--labw)}
  .axis .mo{position:absolute;top:0;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ink2)}
  .axis .tkm{position:absolute;top:15px;width:1px;height:5px;background:rgba(255,255,255,.2)}
  .axis .tk{position:absolute;top:20px;font-size:10px;color:var(--muted);transform:translateX(-50%)}

  .band{margin-bottom:16px}
  .band-h{display:flex;align-items:baseline;gap:9px;padding:0 4px 7px}
  .band-h .bt{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
  .band-h .bs{font-size:10.5px;color:var(--faint)}
  .band-body{border-radius:22px;overflow:hidden;background:var(--glass);
    backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(255,255,255,.06),0 22px 46px -34px rgba(0,0,0,.7)}
  .lane{position:relative;display:flex;border-top:1px solid var(--hair)}
  .lane:first-child{border-top:none}
  .lane-h{flex:0 0 var(--labw);padding:13px 0 13px 22px}
  .lane-h .ln{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .lane-h .lq{font-size:10px;color:var(--faint);line-height:1.45;margin-top:4px;padding-right:14px}
  .lane.is-empty .lane-h .ln{color:var(--muted)}
  .lane-body{position:relative;flex:1 1 auto;min-height:56px}
  .gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.04);pointer-events:none}
  .gl.mo{background:rgba(255,255,255,.08)}
  .todaybeam{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;z-index:5;pointer-events:none;border-radius:3px;
    background:linear-gradient(to bottom,rgba(205,222,255,.45),rgba(176,202,255,.12));box-shadow:0 0 14px 1px rgba(160,195,255,.3)}
  .lane-empty{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:11px;color:var(--faint);
    display:flex;align-items:center;gap:9px}
  .lane-empty .dash{width:70px;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 5px,transparent 5px 10px)}

  .pbar{position:absolute;height:38px;border-radius:12px;display:flex;align-items:center;z-index:3;
    background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.06));
    backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.14),0 10px 22px -16px rgba(0,0,0,.8);
    cursor:pointer}
  .pbar .pw{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0;padding:0 13px}
  .pbar .pl{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .pbar .pmeta{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .pbar.narrow .pw{position:absolute;left:100%;margin-left:11px;flex:0 0 auto;padding:5px 11px;border-radius:12px;
    background:rgba(255,255,255,.08);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 0 0 1px rgba(255,255,255,.08);z-index:5}
  .pbar.narrow .pl{overflow:visible;text-overflow:clip;flex:0 0 auto}
  .pbar.clipL{border-top-left-radius:2px;border-bottom-left-radius:2px}
  .pbar.clipR{border-top-right-radius:2px;border-bottom-right-radius:2px}
  .chip{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;
    background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--muted);white-space:nowrap}
  .chip.stage{color:var(--accent-ink);background:rgba(255,122,31,.13);box-shadow:inset 0 0 0 1px rgba(255,146,72,.32)}
  .chip.nodate{color:var(--faint)}
  .pbar.near{background:linear-gradient(180deg,rgba(255,140,60,.20),rgba(255,122,31,.06));
    box-shadow:inset 0 1px 0 rgba(255,196,148,.28),inset 0 0 0 1px rgba(255,146,72,.4),0 12px 28px -13px rgba(255,96,12,.5)}
  .pbar.near .pl{color:#ffdcb9}
  .pbar.done{opacity:.5}
  .pbar.done .pl{text-decoration:line-through}
  .pbar.hidden-proj{outline:1.5px dashed rgba(255,255,255,.28);outline-offset:2px;opacity:.5}
  /* milestone: due with no start. A point in time, so it gets no runway. */
  .pbar.mile{background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;width:0}
  .pbar.mile .mk{position:absolute;left:-9px;top:50%;width:18px;height:18px;border-radius:4px;
    transform:translateY(-50%) rotate(45deg);background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.13));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.42),0 8px 18px -12px rgba(0,0,0,.9)}
  .pbar.mile.near .mk{background:linear-gradient(160deg,rgba(255,170,105,.85),rgba(255,122,31,.45));
    box-shadow:inset 0 0 0 1px rgba(255,196,148,.6),0 10px 22px -11px rgba(255,96,12,.6)}
  .pbar.mile .pw{margin-left:17px}
  .pbar.mile.done .mk{opacity:.5}
  .pbar .cap{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;transform:translateY(-50%);background:rgba(255,255,255,.45)}
  .pbar .cap.l{left:-3px}.pbar .cap.r{right:-3px}
  .pbar .dep-o{position:absolute;top:50%;right:-14px;width:9px;height:9px;border-radius:50%;transform:translateY(-50%);
    background:rgba(127,215,196,.85);box-shadow:0 0 8px 1px rgba(90,200,175,.35)}
  .pbar .dep-i{position:absolute;top:50%;left:-14px;width:9px;height:9px;border-radius:50%;transform:translateY(-50%);
    background:rgba(127,215,196,.4);box-shadow:inset 0 0 0 1px rgba(127,215,196,.8)}

  .undated{margin:10px 0 0 var(--labw,176px);font-size:11px;color:var(--faint);line-height:1.6}
  .conn{position:absolute;width:1px;z-index:2;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.05));pointer-events:none}
  /* Two kinds of line, two different facts: dep = a cross-project dependency, orthogonal track with an arrowhead; stream = ordering within one lane, a direct dashed line with no arrowhead */
  .edge{fill:none;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
  .edge.dep{stroke:rgba(255,255,255,.3)}
  .edge.stream{stroke:rgba(255,255,255,.13);stroke-width:1.3;stroke-dasharray:1 6}
  .vein{fill:none;stroke:rgba(184,208,255,.07);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
  .plug{fill:rgba(255,255,255,.45)}
  .tcard{position:absolute;z-index:4;width:158px;border-radius:10px;cursor:pointer;padding:8px 11px;
    background:rgba(20,23,28,.5);backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.07),0 10px 22px -15px rgba(0,0,0,.85)}
  .tcard:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.13)}
  .tcard .tcl{font-size:11.5px;font-weight:500;line-height:1.35;color:var(--ink2)}
  .tcard .tcd{font-size:10px;color:var(--muted);margin-top:4px}
  .tcard .tcd.over{color:var(--st-bl);font-weight:600}
  .tdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .tcard.fin{opacity:.5}
  .tcard.fin .tcl{text-decoration:line-through}
  .tcard .tcx{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:var(--muted);line-height:1.7}
  .tcard.open{z-index:20;background:rgba(20,23,28,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 30px 60px -26px rgba(0,0,0,.92)}
  .tcard.open .tcx{display:block}
  .tcard .tcx b{color:var(--ink2)}
  .td-ns{background:var(--st-ns)}.td-ip{background:var(--st-ip)}.td-wf{background:var(--st-wf)}
  .td-bl{background:var(--st-bl)}.td-dn{background:var(--st-dn)}

  /* ===== Kanban ===== */
  .kb{margin-top:14px;display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
  .kb::-webkit-scrollbar{height:8px}
  .kb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
  .kcol{flex:1 1 0;min-width:210px;border-radius:18px;padding:13px 12px 14px;background:var(--glass);
    backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(255,255,255,.06)}
  .kcol .kh{display:flex;align-items:center;gap:7px;margin-bottom:11px}
  .kcol .kh .kn{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
  .kcol .kh .kc{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .kcard{border-radius:11px;padding:9px 11px;margin-bottom:8px;background:rgba(20,23,28,.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.07);cursor:pointer}
  .kcard:hover{background:rgba(20,23,28,.62)}
  .kcard .kt{font-size:12px;font-weight:550;line-height:1.35;color:var(--ink)}
  .kcard .km{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
  .kcard .kp{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .kcard .kd{font-size:10px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .kcard .kd.over{color:var(--st-bl);font-weight:650}
  .kcard.fin{opacity:.5}.kcard.fin .kt{text-decoration:line-through}
  .kempty{font-size:11px;color:var(--faint);padding:6px 2px}

  .kcol.ghost{background:rgba(255,255,255,.022);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .kcol.over{box-shadow:inset 0 0 0 1.5px rgba(255,146,72,.6),0 0 24px -6px rgba(255,122,31,.5)}
  .kbody{min-height:52px}
  .kcard{transition:transform .12s var(--ease),opacity .12s var(--ease)}
  .kcard:active{cursor:grabbing}
  .kcard.dragging{opacity:.35;transform:scale(.97)}
  .kcard.proj .kt{font-weight:650}
  .kcard.proj{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.12)}
  .draghint{position:absolute;left:26px;top:0;font-size:10.5px;color:var(--faint)}
  .axishead{position:relative;height:18px}
  .pendbtn{background:rgba(255,122,31,.16)!important;color:#ffdcb9!important;
    box-shadow:inset 0 0 0 1px rgba(255,146,72,.5)!important}
  .pendov{display:none;position:fixed;inset:0;z-index:120;background:rgba(8,10,13,.72);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center}
  .pendov.on{display:flex}
  .pendbox{width:min(760px,92vw);max-height:82vh;display:flex;flex-direction:column;gap:11px;padding:22px;border-radius:22px;

const DEFAULTS = { showDone:false, showParked:false, overdueOnly:false,
  showEmptyLanes:true, showTaskCards:true, showDeps:true, showEmptyCols:true,
  gridCollapsed:false, kbGroup:"status" };

const S = { tab:"lane", showRail:true,
  showDone:false, showParked:false, overdueOnly:false,
  wings:{personal:true, business:true},
  lines:Object.fromEntries([["general",true]].concat(SETUP.brands.map(b => [b,true]))),
  laneOff:new Set(),
  showEmptyLanes:true, showTaskCards:true, showDeps:true,
  showEmptyCols:true, kbGroup:"status",
  calLayers:{task:true, proj:true, ren:true}, weekStartMon:true, calMonth:"{{THIS_MONTH}}",
  gridCollapsed:false, gridCols:{start:true, priority:true},
  openMenu:null };

const $ = s => document.querySelector(s);
const D = s => new Date(s + "T00:00:00");
const ISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayDiff = (a,b) => Math.round((D(b) - D(a)) / 86400000);
const fmt = s => s.slice(5).replace("-","/");
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const L = () => DICT;
const DATA = () => DECK;

const ST = {
  "not-started":{c:"td-ns", key:"st_ns"}, "in-progress":{c:"td-ip", key:"st_ip"},
  "waiting":{c:"td-wf", key:"st_wf"}, "blocked":{c:"td-bl", key:"st_bl"}, "done":{c:"td-dn", key:"st_dn"}
};
const ST_ORDER = ["not-started","in-progress","waiting","blocked","done"];
const stName = k => L()[ST[k].key];
/* stage lives on the Brief, not on a task (doctrine §8), so grouping by stage drags the project. */
const STAGE_ORDER = ["pending","planning","pursuing","executing","closed"];
const sgName = k => L()["sg_" + (k || "none")];
/* ⛔ `kind` is not a word anybody typed: deck.py derives it for each mention in a
   daily note, `brief` when the link names a Brief and `guide` for everything
   else, so the pair is closed at two. Both halves read through DICT like every
   other visible string rather than shipping the generator's own token to a page. */
const kindName = k => k === "guide" ? L().kindGuide : L().kindBrief;

const PENDING = [];
/* ⛔ Both wings come from SETUP, never spelled out here. The generator renames
   nothing, so a vault whose personal wing is `01_Personal-Wing` (or any other
   prefix) would be handed a path that does not exist on disk, and every pending
   edit copied out of the deck would point a session at the wrong file. */
const projPath = p => p.wing === "personal"
  ? `${SETUP.personalWing}/Personal-Projects/${p.name.replace(/\s+/g,"-")}/`
  : `${SETUP.business.wing}/02_Work/${p.lane}/${p.name.replace(/\s+/g,"-")}/`;
const briefPath = p => `${projPath(p)}_${p.name.replace(/\s+/g,"-")}-Brief.md`;
function addPending(file, key, from, to){
  const hit = PENDING.find(e => e.file === file && e.key === key);
  if(hit){ hit.to = to; if(hit.from === hit.to) PENDING.splice(PENDING.indexOf(hit),1); }
  else PENDING.push({file, key, from, to});
}

/* ---- Lane matrix: derived from SETUP, never from the data. Empty lanes still appear ---- */
function buildMatrix(){
  const l = L(), b = SETUP.business.name;
  const bands = [];
  /* ⛔ The empty-string case is a real vault, not a defect: a vault built with
     no personal wing sends personalWing:"". Drawing the band anyway would put a
     folder name on screen that nobody could open. */
  if(S.wings.personal && SETUP.personalWing) bands.push({
    id:"personal", title:l.personal, sub:SETUP.personalWing,
    lanes:[{id:"personal", name:l.personalProjects, q:l.q_personal}] });
  const mk = (prefix, brand) => SETUP.lanes.map(x => ({ id:prefix+"/"+x, name:l[x], q:l["q_"+x], brand }));
  if(S.wings.business){
    if(S.lines.general) bands.push({id:"gen", title:b+" · "+l.general, sub:SETUP.business.wing+"/02_Work", lanes:mk("gen", null)});
    if(SETUP.brands.length > 1) SETUP.brands.forEach(br => { if(S.lines[br])
      bands.push({id:"br-"+br, title:b+" · "+br, sub:"brand: "+br, lanes:mk("br-"+br, br)}); });
  }
  return bands;
}
const laneKeyOf = p => p.wing === "personal" ? "personal"
  : (p.brand ? "br-"+p.brand : "gen") + "/" + p.lane;

/* The swimlane's x-axis window, derived on every rebuild.
   ⛔ Never a written-down pair of dates. Every bar, every diamond, every month
   tick and the TODAY line are all positioned as an offset from WIN_A, so a
   fixed pair is true for the afternoon it was typed and quietly wrong for every
   vault afterwards: work would sit off the left edge, or the whole board would
   float months away from today with nothing on it.
   It covers today plus every span the deck holds, snapped out to whole months
   so the month ticks have somewhere to land, and widened to at least four
   months so a vault whose work all falls in one month still reads as a runway. */
function deckWindow(){
  const lo = [TODAY], hi = [TODAY];
  DECK.projects.forEach(p => { const [a, b] = projSpan(p); lo.push(a); hi.push(b); });
  lo.sort(); hi.sort();
  const A = D(lo[0]); A.setDate(1);
  const B = D(hi[hi.length - 1]); B.setMonth(B.getMonth() + 1, 1);
  while(dayDiff(ISO(A), ISO(B)) < 120) B.setMonth(B.getMonth() + 1, 1);
  return [ISO(A), ISO(B)];
}
const [WIN_A, WIN_B] = deckWindow();
const SPAN = dayDiff(WIN_A, WIN_B), PXD = 7.6, LABW = 176;
const x = d => dayDiff(WIN_A, d) * PXD;
const bodyW = SPAN * PXD;

/* ONE predicate, used by the swimlane and by Countdown, so the two
   can never disagree about what a milestone is. A project that declares a due
   date and no start date is a point in time, not a runway: swimlane draws it as
   a diamond, and Countdown holds exactly this set and nothing else.
   ⛔ It reads the Brief's own `started:` key, never the fallback dates derived
   from its tasks: the key is the owner's declaration, and deriving it would let
   one dated task silently turn a milestone into a bar. */
/* SHAPE: due with no start is a point in time, so the swimlane draws a diamond. */
const isMilestone = p => !!p.due && !p.started;
/* PANEL: Countdown is the diamonds MINUS anything carrying `renew_by`.
   A record that carries renew_by belongs to What expires (R1) and
   nowhere else, or the same date counts down in two panels and the owner has to
   work out that they are one thing. ⛔ R1 wins because renew_by is the more
   specific claim: it says this lapses, not that work on it ends.
   ⭐ Countdown is DERIVED from the diamond set rather than defined beside it, so
   the two can never drift into disagreeing about what a milestone is. */
const inCountdown = p => isMilestone(p) && !p.renew_by;
/* renew_by appears in What expires and NOWHERE
   else on the timeline. So a Brief carrying it is off the swimlane too, not just
   out of Countdown. ⛔ A Brief should not carry renew_by at all (section 8
   declares that key on `entity`, and all six templates that use it are entity
   notes), so this is the deck refusing to draw a mistake twice rather than a
   shape the product ever produces. `doctor` names it. */
const hasNoDates = p => !p.started && !p.due;
const offTimeline = p => hasNoDates(p) || !!p.renew_by;

function projSpan(p){
  const ds = p.tasks.flatMap(t => [t.start, t.due]).filter(Boolean).sort();
  let a = p.started || ds[0] || TODAY;
  let b = p.due || ds[ds.length-1] || TODAY;
  if(dayDiff(a,b) < 7) b = ISO(new Date(D(a).getTime() + 7*86400000));
  return [a,b];
}
const isOver = t => t.due && t.status !== "done" && dayDiff(TODAY, t.due) < 0;

/* The canonical set: the whole Deck counts one thing, projects that are still alive.
   Two exclusions: Briefs that declare hide_on_deck, and projects already closed.
   The F control row does not touch this; that row only governs the view below. */
function deckProjects(){
  return DATA().projects.filter(p => !p.hide_on_deck && p.status !== "done");
}
/* The view's denominator: everything this Deck could show, closed ones included, since Show done brings them back */
const deckScope = () => DATA().projects.filter(p => !p.hide_on_deck);
/* View only: every button in the F row acts here and nowhere else */
function visibleProjects(){
  return DATA().projects.filter(p =>
    (S.showDone || p.status !== "done") &&
    (S.showParked || !p.hide_on_deck) &&
    (p.wing === "personal" ? S.wings.personal : S.wings.business) &&
    (p.wing === "personal" || S.lines[p.brand || "general"]) &&
    !S.laneOff.has(laneKeyOf(p)));
}
function visibleTasks(){
  return visibleProjects().flatMap(p => p.tasks
    .filter(t => (S.showDone || t.status !== "done") && (!S.overdueOnly || isOver(t)))
    .map(t => ({...t, proj:p})));
}
const allTasks = () => deckScope().flatMap(p => p.tasks);

/* ======================= D1 · D2 · D3 ======================= */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const md = iso => { const d=D(iso), y=D(TODAY).getFullYear();
  return d.getDate()+" "+MON[d.getMonth()]+(d.getFullYear()!==y?" "+String(d.getFullYear()).slice(2):""); };
const dleft = iso => dayDiff(TODAY, iso);

/* Top of the left column: L1 health as the standfirst, L2 next action as the only filled panel */
function renderTop(){
  const l = L(), ps = deckProjects();
  const open = ps.flatMap(p => p.tasks).filter(t => t.status !== "done");
  const cnt = k => open.filter(t => t.status === k).length;
  const key = [[l.k_actionable, cnt("not-started")+cnt("in-progress"), "var(--st-ip)"],
               [l.k_waiting,    cnt("waiting"), "var(--st-wf)"],
               [l.k_blocked,    cnt("blocked"), "var(--st-bl)"]];

  $("#p-health").innerHTML = `<div class="ledger">
      <div class="lg-l"><span class="lbl">L1</span><b class="hn hn-l num">${open.length}</b><span>${l.openTasks}</span></div>
      <div class="lg-bar">${key.map(k => `<i style="flex:${k[1]};background:${k[2]}"></i>`).join("")}</div>
      <div class="lg-key">${key.map(k =>
        `<span><em style="background:${k[2]}"></em><b class="num">${k[1]}</b> ${k[0]}</span>`).join("")}</div>
    </div>`;

  const prio = ps.filter(p => (p.priority||9) <= 2)
    .flatMap(p => p.tasks.filter(t => t.status !== "done").map(t => ({...t, proj:p})))
    .sort((a,b) => {
      const oa = isOver(a)?0:1, ob = isOver(b)?0:1;
      if(oa !== ob) return oa - ob;
      return (a.due||"9999") < (b.due||"9999") ? -1 : 1;
    });

  if(!prio.length){
    $("#p-prio").innerHTML = `<div class="leadwrap"><div class="kick"><span class="lbl">L2</span>${l.nextAction}</div>
      <div class="emptyline" style="margin-top:12px">${l.emptyPrio}</div></div>`;
    return;
  }
  const L0 = prio[0], Ld = L0.due ? dleft(L0.due) : null, SHOW = 5;
  $("#p-prio").innerHTML = `<div class="leadwrap">
    <div class="kick acc"><span class="lbl">L2</span>${l.nextAction}</div>
    <div class="hero">
      <div class="t">
        <h2>${esc(L0.title)}</h2>
        <div class="meta"><b>${esc(L0.proj.name)}</b> &nbsp;·&nbsp; ${l.dueWord} <span class="num">${L0.due?md(L0.due):l.none}</span></div>
        <div class="blk"><i class="schip" style="--c:${getComputedStyle(document.documentElement).getPropertyValue(
            {"not-started":"--st-ns","in-progress":"--st-ip","waiting":"--st-wf","blocked":"--st-bl","done":"--st-dn"}[L0.status])}">${stName(L0.status)}</i>
          ${L0.waiting_on?`<span>${l.waiting} <b>${esc(L0.waiting_on)}</b></span>`:""}</div>
      </div>
      <div class="n"><div class="hn hn-xl num ${Ld!==null&&Ld<0?"":"acc"}">${Ld===null?"·":Math.abs(Ld)}</div>
        <div class="lab">${Ld!==null&&Ld<0?l.daysOver:l.daysLeft}</div></div>
    </div>
    <div class="tail">
      <div class="kick">${l.thenWord}<span class="r">${l.byDueDate}</span></div>
      <ul class="plist">${prio.slice(1,SHOW).map(t => `<li>
        <i class="sdot ${ST[t.status].c}"></i>
        <span class="p-t">${esc(t.title)}</span>
        <span class="p-p">${esc(t.proj.name)}</span>
        <span class="p-d num">${t.due?md(t.due):"·"}</span>
        <span class="p-n num">${t.due?dleft(t.due)+"d":""}</span></li>`).join("")}</ul>
      ${prio.length>SHOW?`<div class="more">+${prio.length-SHOW} ${l.moreOpen}</div>`:""}
    </div></div>`;
}

/* ======================= E · Tabs ======================= */
function renderTabs(){
  const l = L();
  const nProj = visibleProjects().length, nTask = visibleTasks().length;
  const tabs = [["lane", l.tabLane, nProj], ["kanban", l.tabKanban, S.kbGroup==="stage"?nProj:nTask],
                ["cal", l.tabCal, ""], ["grid", l.tabGrid, nTask]];
  $("#tabs").innerHTML = `<span class="lbl">E</span>` + tabs.map(([id,name,c]) =>
    `<span class="tab" data-t="${id}" data-on="${S.tab===id?1:0}">${name}${c!==""?`<span class="tc num">${c}</span>`:""}</span>`).join("")
    + `<span class="sp"></span><span id="pendhost"></span>`;
  $("#tabs").querySelectorAll(".tab").forEach(t => t.onclick = () => { S.tab = t.dataset.t; renderAll(); });
}

/* ======================= F · Control row =======================
   Split the way Linear splits it: Filter governs what comes in, Display governs what it looks like.
   Group and Layers sit outside the menus, because they change what this view is saying rather than filtering it.
   One polarity throughout, on = show more, and filter state is always surfaced as removable chips plus Reset. */
function isDirty(){
  return Object.keys(DEFAULTS).some(k => S[k] !== DEFAULTS[k])
    || S.laneOff.size > 0
    || !S.wings.personal || !S.wings.business
    || Object.values(S.lines).some(v => !v)
    || Object.values(S.calLayers).some(v => !v);
}
function resetAll(){
  Object.keys(DEFAULTS).forEach(k => S[k] = DEFAULTS[k]);
  S.laneOff.clear();
  S.wings = {personal:true, business:true};
  /* ⛔ Rebuilt from SETUP.brands, exactly the way S.lines was first built.
     Naming brands here would reset the owner's real lines out of existence: any
     brand not in the list would arrive as undefined, read as off, and every
     project on it would leave the board with no chip to bring it back. */
  S.lines = Object.fromEntries([["general", true]].concat(SETUP.brands.map(b => [b, true])));
  S.calLayers = {task:true, proj:true, ren:true};
  renderAll();
}
const chk = (on, label, act, swatch) =>
  `<div class="mrow" data-act="${act}" data-on="${on?1:0}">
     <span class="mbox${swatch?" sw "+swatch:""}"></span><span class="mn">${label}</span></div>`;

function renderControls(){
  const l = L();
  let filterN = 0;
  if(S.overdueOnly) filterN++;
  if(!S.showDone) filterN++;
  if(!S.showParked) filterN++;
  if(!S.wings.personal || !S.wings.business) filterN++;
  if(Object.values(S.lines).some(v => !v)) filterN++;

  const menuBtn = (id, label, badge) =>
    `<span class="menuwrap"><span class="ctl mbtn" data-menu="${id}" data-on="${S.openMenu===id?1:0}">${label}${
      badge?`<span class="badge num">${badge}</span>`:""}<span class="car">▾</span></span>
      <div class="menu" id="m-${id}"></div></span>`;

  let h = `<span class="lbl">F</span>`;
  if(S.tab === "kanban")
    h += `<span class="inlinegrp"><span class="glab">${l.groupBy}</span>` +
      `<span class="seg"><span class="segb" data-act="kbStatus" data-on="${S.kbGroup==="status"?1:0}">${l.byStatus}</span>` +
      `<span class="segb" data-act="kbStage" data-on="${S.kbGroup==="stage"?1:0}">${l.byStage}</span></span></span>`;
  if(S.tab === "cal") h += menuBtn("layers", l.layers);
  if(S.tab === "lane") h += menuBtn("lanes", l.lanesBtn, S.laneOff.size ? S.laneOff.size : 0);
  h += menuBtn("filter", l.filter, filterN);
  h += menuBtn("display", l.display);
  if(isDirty()) h += `<span class="ctl reset" data-act="reset">${l.reset}</span>`;
  $("#ctlrow").innerHTML = h;

  /* Menu contents */
  const M = {};
  M.filter = `<div class="mh">${l.mInclude}</div>` +
    chk(S.showDone, l.showDone, "showDone") +
    chk(S.showParked, l.showParked, "showParked") +
    `<div class="mh">${l.mNarrow}</div>` +
    chk(S.overdueOnly, l.overdueOnly, "overdueOnly") +
    `<div class="mh">${l.mWings}</div>` +
    chk(S.wings.personal, l.personal, "wing:personal") +
    chk(S.wings.business, SETUP.business.name, "wing:business") +
    (SETUP.brands.length > 1 ? `<div class="mh">${l.mLines}</div>` +
      chk(S.lines.general, l.general, "line:general") +
      SETUP.brands.map(b => chk(S.lines[b], b, "line:"+b)).join("") : "") +
    `<div class="mfoot">${l.filterFoot}</div>`;

  M.display = `<div class="mh">${l.mThisView}</div>` +
    (S.tab === "lane" ? chk(S.showEmptyLanes, l.showEmptyLanes, "showEmptyLanes") +
                        chk(S.showTaskCards, l.showTaskCards, "showTaskCards") +
                        chk(S.showDeps, l.showDeps, "showDeps") : "") +
    (S.tab === "kanban" ? chk(S.showEmptyCols, l.showEmptyCols, "showEmptyCols") : "") +
    (S.tab === "cal" ? chk(S.weekStartMon, l.weekStartMon, "weekStartMon") : "") +
    (S.tab === "grid" ? chk(!S.gridCollapsed, l.expandGroups, "gridCollapsed") +
                        `<div class="mh">${l.columns}</div>` +
                        chk(S.gridCols.start, l.colStart, "col:start") +
                        chk(S.gridCols.priority, l.colPriority, "col:priority") : "") +
    `<div class="mfoot">${l.displayFoot}</div>`;

  M.layers = `<div class="mh">${l.mLayers}</div>` +
    chk(S.calLayers.task, l.layTask, "lay:task", "sw-task") +
    chk(S.calLayers.proj, l.layProj, "lay:proj", "sw-proj") +
    chk(S.calLayers.ren, l.layRen, "lay:ren", "sw-ren") +
    `<div class="mfoot">${l.layersFoot}</div>`;

  if(S.tab === "lane"){
    const counts = {};
    DATA().projects.forEach(p => counts[laneKeyOf(p)] = (counts[laneKeyOf(p)]||0)+1);
    M.lanes = buildMatrix().map(b => `<div class="mh">${esc(b.title)}</div>` + b.lanes.map(ln =>
      `<div class="mrow${counts[ln.id]?"":" dim"}" data-act="lane:${ln.id}" data-on="${S.laneOff.has(ln.id)?0:1}">
        <span class="mbox"></span><span class="mn">${esc(ln.name)}</span>
        <span class="mc">${counts[ln.id] || l.empty}</span></div>`).join("")).join("")
      + `<div class="mfoot">${l.laneEmptyNote}</div>`;
  }
  Object.keys(M).forEach(k => { const el = $("#m-"+k); if(el) el.innerHTML = M[k]; });
  if(S.openMenu) $("#m-"+S.openMenu)?.classList.add("on");

  $("#ctlrow").querySelectorAll("[data-menu]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    S.openMenu = S.openMenu === b.dataset.menu ? null : b.dataset.menu;
    renderControls();
  });
  $("#ctlrow").querySelectorAll("[data-act]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const a = el.dataset.act;
    if(a === "reset") return resetAll();
    if(a === "kbStatus"){ S.kbGroup = "status"; }
    else if(a === "kbStage"){ S.kbGroup = "stage"; }
    else if(a.startsWith("wing:")) S.wings[a.slice(5)] = !S.wings[a.slice(5)];
    else if(a.startsWith("line:")) S.lines[a.slice(5)] = !S.lines[a.slice(5)];
    else if(a.startsWith("lay:")) S.calLayers[a.slice(4)] = !S.calLayers[a.slice(4)];
    else if(a.startsWith("col:")) S.gridCols[a.slice(4)] = !S.gridCols[a.slice(4)];
    else if(a.startsWith("lane:")){ const id = a.slice(5);
      S.laneOff.has(id) ? S.laneOff.delete(id) : S.laneOff.add(id); }
    else S[a] = !S[a];
    renderAll();
  });
  renderStatusLine();
}

/* Anything filtered out has to be visible, or a glance reads a subset as the whole */
function renderStatusLine(){
  const l = L(), chips = [];
  if(S.overdueOnly) chips.push([l.chipOverdue, "overdueOnly"]);
  if(!S.showDone) chips.push([l.chipDone, "showDone"]);
  if(!S.showParked) chips.push([l.chipParked, "showParked"]);
  if(!S.wings.personal) chips.push([l.chipNoPersonal, "wing:personal"]);
  if(!S.wings.business) chips.push([l.chipNoBusiness, "wing:business"]);
  Object.keys(S.lines).forEach(k => { if(!S.lines[k]) chips.push([l.chipLineOff+" "+(k==="general"?l.general:k), "line:"+k]); });
  if(S.laneOff.size) chips.push([S.laneOff.size+" "+l.chipLanesOff, "lanesReset"]);

  const unit = S.tab === "lane" || (S.tab === "kanban" && S.kbGroup === "stage");
  const shown = unit ? visibleProjects().length : visibleTasks().length;
  const total = unit ? deckScope().length : allTasks().length;
  const word = unit ? l.projects : l.tasksWord;

                <div class="tcx"><b>status</b> ${stName(t.status)}<br>

        </div></div>
      <div class="board" id="board"><div class="inner" id="inner" style="--labw:${LABW}px">${html}</div></div>
      ${undated||renewals?`<div class="undated">${undated?`${undated} ${undated===1?l.undatedNote1:l.undatedNote}`:""}${undated&&renewals?"<br>":""}${renewals?`${renewals} ${renewals===1?l.renewNote1:l.renewNote}`:""}</div>`:""}
    </div>`;

    if(!was) el.classList.add("open");

  requestAnimationFrame(drawEdges); setTimeout(drawEdges, 60); setTimeout(drawEdges, 320);

function gridlines(){
  let g = "", cur = D(WIN_A); cur.setDate(1);
  while(cur <= D(WIN_B)){
    const m0 = ISO(cur);
    if(dayDiff(WIN_A, m0) > 0) g += `<div class="gl mo" style="left:${x(m0)}px"></div>`;
    for(let d = 8; d <= 22; d += 7){
      const day = ISO(new Date(cur.getFullYear(), cur.getMonth(), d));
      if(dayDiff(WIN_A, day) > 0 && dayDiff(day, WIN_B) > 0) g += `<div class="gl" style="left:${x(day)}px"></div>`;
    }
    cur.setMonth(cur.getMonth()+1);
  }
  return g;
}
/* Dependency tracks:
   · dep    = a cross-project dependency. It leaves the SOURCE's left edge, runs across to a shared
              vertical channel on the target's left, drops to the target's row, then turns right into
              the target's left edge. Solid line plus an open chevron arrowhead (cool white, not orange),
              a plug dot at the source, and a thick, very faint vein underneath as the glow.
   · stream = ordering inside one lane by start date: the previous bar's right edge joins the next bar's
              left edge, 1/6 dotted, and never an arrowhead.
   The two are not interchangeable: an arrowhead means a real dependency; a dashed line is only sequence within a lane. */
const CH_MARGIN = 22, CH_TRACK = 5, CH_TARGET_GAP = 16, RAIL_R = 8;
function orthPath(ax, ay, cx, bx, by, r){
  if(Math.abs(by-ay) < 1) return `M${ax},${ay} L${bx},${by}`;
  const dY = by > ay ? 1 : -1;
  const rr = Math.max(2, Math.min(r, Math.abs(by-ay)/2, Math.abs(ax-cx), Math.abs(bx-cx)));
  return `M${ax},${ay} L${cx+rr},${ay} Q${cx},${ay} ${cx},${ay+dY*rr}`
       + ` L${cx},${by-dY*rr} Q${cx},${by} ${cx+rr},${by} L${bx},${by}`;
}
function drawEdges(){
  const svg = $("#edges"), inner = $("#inner");
  if(!svg || !inner) return;
  const box = inner.getBoundingClientRect();
  svg.setAttribute("width", inner.scrollWidth); svg.setAttribute("height", inner.scrollHeight);
  const defs = `<defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto">
      <path d="M0.6,0.6 L6,3 L0.6,5.4" fill="none" stroke="rgba(226,232,246,.9)"
        stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
  if(!S.showDeps){ svg.innerHTML = defs; return; }

  /* Each bar's left edge, right edge and midline */
  const pos = {};
  inner.querySelectorAll(".pbar[data-p]").forEach(el => {
    const r = el.getBoundingClientRect();
    pos[el.dataset.p] = { x0:r.left-box.left, x1:r.right-box.left, y:r.top-box.top+r.height/2,
                          lane:el.closest(".lane") };
  });

  let veins = "", rails = "", plugs = "";

  /* stream: ordering within one lane */
  const byLane = new Map();
  DATA().projects.forEach(p => { const q = pos[p.id]; if(!q) return;
    if(!byLane.has(q.lane)) byLane.set(q.lane, []);
    byLane.get(q.lane).push({id:p.id, start:projSpan(p)[0]}); });
  byLane.forEach(arr => {
    arr.sort((a,b) => a.start < b.start ? -1 : 1);
    for(let i = 0; i < arr.length-1; i++){
      const A = pos[arr[i].id], B = pos[arr[i+1].id];
      if(A && B && B.x0 > A.x1 + 4)
        rails += `<path class="edge stream" d="M${A.x1},${A.y} L${B.x0},${B.y}"/>`;
    }
  });

  /* dep: a cross-project dependency, routed through the shared left channel */
  const de = [];
  DATA().projects.forEach(p => (p.depends_on||[]).forEach(src => {
    const A = pos[src], B = pos[p.id];
    if(A && B) de.push({ax:A.x0, ay:A.y, bx:B.x0, by:B.y});
  }));
  const grp = {};
  de.forEach((e,i) => { const k = e.bx+"_"+e.by; (grp[k] = grp[k] || []).push(e); });
  const gs = Object.values(grp).map(arr => ({arr, base:Math.min(arr[0].bx, ...arr.map(e => e.ax)) - CH_MARGIN}));
  gs.sort((a,b) => b.base - a.base);
  for(let i = 1; i < gs.length; i++)
    if(gs[i-1].base - gs[i].base < CH_TARGET_GAP) gs[i].base = gs[i-1].base - CH_TARGET_GAP;
  gs.forEach(g => { const n = g.arr.length;
    g.arr.forEach((e,i) => { e.cx = Math.max(8, g.base + i*CH_TRACK); e.by += (i-(n-1)/2)*3.4; }); });

  de.forEach(e => {
    const d = orthPath(e.ax, e.ay, e.cx, e.bx, e.by, RAIL_R);
    veins += `<path class="vein" d="${d}"/>`;
    rails += `<path class="edge dep" d="${d}" marker-end="url(#arw)"/>`;
    plugs += `<circle class="plug" cx="${e.ax}" cy="${e.ay}" r="1.7"/>`;
  });
  svg.innerHTML = defs + veins + rails + plugs;
}

/* ======================= H · Kanban ======================= */
function renderKanbanView(){
  const l = L();
  let cols, unit;
  if(S.kbGroup === "status"){
    unit = "task";
    const ts = visibleTasks();
    cols = ST_ORDER.filter(k => S.showDone || k !== "done").map(k => ({
      key:k, name:stName(k), dot:ST[k].c,
      items:ts.filter(t => t.status === k).sort((a,b) => (a.due||"9999") < (b.due||"9999") ? -1 : 1)
    }));
  } else {
    unit = "project";
    const ps = visibleProjects();
    cols = STAGE_ORDER.filter(k => S.showDone || k !== "closed").map(k => ({
      key:k, name:sgName(k), dot:"",
      items:ps.filter(p => p.stage === k).sort((a,b) => (a.priority||9) - (b.priority||9))
    }));
    cols.push({key:"", name:sgName(null), dot:"", ghost:true, items:ps.filter(p => !p.stage)});
  }
  if(!S.showEmptyCols) cols = cols.filter(c => c.items.length);

  const card = it => {
    if(unit === "task"){
      const over = isOver(it);
      return `<div class="kcard${it.status==="done"?" fin":""}" draggable="true" data-id="${it.id}">
        <div class="kt">${esc(it.title)}</div>
        <div class="km"><span class="chip">${esc(it.proj.lane ? (l[it.proj.lane] || it.proj.lane) : l.personal)}</span>
          <span class="kp">${esc(it.proj.name)}</span>
          <span class="kd${over?" over":""}">${it.due ? (over ? l.overdue : fmt(it.due)) : "·"}</span></div></div>`;
    }
    const left = it.due ? dayDiff(TODAY, it.due) : null;
    const open = it.tasks.filter(t => t.status !== "done").length;
    return `<div class="kcard proj${it.status==="done"?" fin":""}" draggable="true" data-id="${it.id}">
      <div class="kt">${esc(it.name)}</div>
      <div class="km"><span class="chip">${esc(it.lane ? (l[it.lane] || it.lane) : l.personal)}</span>
        ${it.brand?`<span class="chip">${esc(it.brand)}</span>`:""}
        <span class="kp">${open} ${l.tasksWord}</span>
        <span class="kd${left!==null&&left<0?" over":""}">${left===null?"·":(left<0?l.overdue:left+l.dleft)}</span></div></div>`;
  };

  $("#viewhost").innerHTML = `<div class="axishead"><span class="lbl">H</span>
      <span class="draghint">${unit==="task"?l.dragHintTask:l.dragHintProj}</span></div>
    <div class="kb">` + cols.map(c => `<div class="kcol${c.ghost?" ghost":""}" data-col="${c.key}">
      <div class="kh">${c.dot?`<span class="tdot ${c.dot}"></span>`:""}<span class="kn">${esc(c.name)}</span>
        <span class="kc num">${c.items.length}</span></div>
      <div class="kbody">${c.items.length ? c.items.map(card).join("") : `<div class="kempty">${l.empty}</div>`}</div>
    </div>`).join("") + `</div>`;

  $("#viewhost").querySelectorAll(".kcard").forEach(el => {
    el.addEventListener("dragstart", e => { el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", el.dataset.id); });
    el.addEventListener("dragend", () => { el.classList.remove("dragging");
      $("#viewhost").querySelectorAll(".kcol").forEach(c => c.classList.remove("over")); });
  });
  $("#viewhost").querySelectorAll(".kcol").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => {
      e.preventDefault(); col.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain"), to = col.dataset.col;
      if(!id) return;
      if(unit === "task"){
        for(const p of DATA().projects){
          const t = p.tasks.find(t => t.id === id);
          if(t){ if(t.status === to) return;
            addPending(`${projPath(p)}Tasks/${t.title.replace(/\s+/g,"-").toLowerCase()}.md`, "status", t.status, to);
            t.status = to; break; }
        }
      } else {
        const p = DATA().projects.find(p => p.id === id);
        if(!p || (p.stage||"") === to) return;
        addPending(briefPath(p), "stage", p.stage || "(none)", to || "(none)");
        p.stage = to || undefined;
      }
      renderAll();
    });
  });
}

  const days = S.weekStartMon ? ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"] : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    <div class="calgrid">${cells}</div></div>`;
  $("#viewhost").querySelectorAll(".calnav").forEach(n => n.onclick = () => { S.calMonth = n.dataset.m; renderCalView(); });
}

function renderView(){
  if(S.tab === "lane") renderLaneView();
  else if(S.tab === "kanban") renderKanbanView();
  else if(S.tab === "cal") renderCalView();
  else renderGridView();
}

/* ============ L3 (bottom of the left column) and the right column R1 R2 R3 ===
   ⛔ ONE numbering scheme: the position labels the panels themselves print.
   Countdown is L3 because it sits in the left column's lead row; Expires,
   Moving and Standing rules are R1, R2 and R3 down the right column. There is
   no R4, and the locals below are named after the panel rather than a number so
   a second scheme can never grow back.
   All four share the same headline grammar: a big number in front, one line
   naming it, one small line trailing. The three right-column panels each add a
   `.src` naming the vault key they were read from; Countdown does not, because
   it holds the same milestones the swimlane beside it already draws. */
function renderCockpit(){
  const l = L(), d = DATA(), ps = deckProjects();

  /* ---- L3 Countdown: card style, one card per milestone ---- */
  /* Milestones ONLY, the same set the swimlane draws as diamonds.
     ⛔ A project carrying both a start and a due is a runway, and it belongs on
     the swimlane where its span is visible, not in a countdown that would report
     only its last day. The hairline went with this change: a point in time has
     no runway to have half-run. */
  const gates = ps.filter(inCountdown).map(p => ({
    name:p.name, due:p.due, left:dleft(p.due),
    lane:(p.lane ? (l[p.lane] || p.lane) : l.personal).toUpperCase()
  })).sort((a,b) => a.left - b.left);
  const GSHOW = 4;
  let pGates = `<div class="kick"><span class="lbl">L3</span>${l.gates}<span class="r">${gates.length} ${l.deadlinesWord}</span></div>`;
  if(!gates.length) pGates += `<div class="emptyline" style="margin-top:14px">${l.emptyGates}</div>`;
  else {
    pGates += `<div class="mgrid" style="margin-top:12px">` + gates.slice(0,GSHOW).map((g,i) => `
      <div class="mcard${i===0&&g.left>=0?" next":""}${g.left<0?" over":""}">
        <span class="mc-tag"><span class="gk"></span>${esc(g.lane)}</span>
        <div class="mc-title">${esc(g.name)}</div>
        <div class="mc-cd"><b>${Math.abs(g.left)}</b><span class="u">${g.left<0?l.overdue:l.dleft}</span></div>
        <div class="mc-date">${md(g.due)}</div>
      </div>`).join("") + `</div>`;
    const tail = gates.slice(GSHOW);
    if(tail.length) pGates += `<div class="more">+${tail.length} ${l.furtherOut} · ${
      tail.map(g => `<span class="num">${g.left}d</span>`).join(" · ")}</div>`;
    pGates += `<div class="legend">${l.mileNote}</div>`;
  }
  $("#p-gates").innerHTML = pGates;

  /* ---- R1 Expires ---- */
  const rens = d.renewals.map(r => ({...r, left:dleft(r.renew_by)})).sort((a,b) => a.left-b.left);
  let pRen = `<div class="kick"><span class="lbl">R1</span>${l.ren}<span class="src">${l.srcRen}</span><span class="r">${rens.length} ${l.tracked}</span></div>`;
  if(!rens.length) pRen += `<div class="emptyline" style="margin-top:12px">${l.emptyRen}</div>`;
  else {
    const r0 = rens[0], tail = rens.slice(1);
    /* ⛔ room and wing are frontmatter and folder names the owner typed, exactly
       as untrusted as the name beside them: one `<` in a folder name and the
       rest of the panel stops rendering. */
    const row = r => `<li><span class="n-t"><span>${esc(r.name)}</span><em>${esc(r.room)}</em></span>
      <span class="n-d num">${md(r.renew_by)}</span><span class="n-n num">${r.left}d</span></li>`;
    const biz = tail.filter(r => r.wing === "business"), per = tail.filter(r => r.wing === "personal");
    pRen += `<div class="blead"><b class="hn hn-m num acc">${r0.left}</b>
        <span><span class="t">${l.dleftLong} · ${esc(r0.name)}</span>
        <span class="s">${esc(r0.room)} · ${esc(r0.wing)} · ${md(r0.renew_by)}</span></span></div>`
      + (biz.length?`<div class="sublab">${l.businessThen}</div><ul class="nlist">${biz.map(row).join("")}</ul>`:"")
      + (per.length?`<div class="sublab">${l.personalWord}</div><ul class="nlist">${per.map(row).join("")}</ul>`:"");
  }
  $("#p-ren").innerHTML = pRen;

  /* ---- R2 Moving ---- */
  const pu = d.pulse, mx = Math.max(1, ...pu.days), tmx = Math.max(1, ...pu.top.map(t => t.n));
  const nActive = d.projects.filter(p => p.status !== "done").length;
  let pPulse = `<div class="kick"><span class="lbl">R2</span>${l.pulse}<span class="src">${l.srcPulse}</span><span class="r">${l.journalLast} ${pu.days.length}${l.daysShort}</span></div>
    <div class="blead"><b class="hn hn-m num${pu.touched?"":" dim"}">${pu.touched}</b>
      <span><span class="t">${l.projectsTouched}</span>
      <span class="s">${l.ofWord} ${nActive} ${l.activeWord} · ${l.barsNote}</span></span></div>
    <div class="spark">${pu.days.map((v,i) =>
      `<i class="${i===pu.days.length-1?"now":""}" style="height:${v?Math.max(v/mx*100,8).toFixed(1)+"%":"2px"}"></i>`).join("")}</div>`;
  if(pu.top.length){
    pPulse += `<div class="sublab">${l.mostMentioned}</div><ul class="tlist">${pu.top.map(t =>
        `<li><span class="t-t">${esc(t.name)} <em>${kindName(t.kind)}</em></span>
          <span class="hbar"><i style="width:${Math.round(t.n/tmx*100)}%"></i></span>
          <span class="t-n num">${t.n}</span></li>`).join("")}</ul>`;
    if(pu.silent.length) pPulse += `<div class="sublab">${l.silent}</div><div class="quiet">${
      pu.silent.map(sv => `<b>${esc(sv.name)}</b> <span class="num">${sv.days}d</span>`).join("<i>·</i>")}</div>`;
  } else pPulse += `<div class="emptyline" style="margin-top:11px">${l.emptyPulse}</div>`;
  $("#p-pulse").innerHTML = pPulse;

  /* ---- R3 Standing rules ---- */
  const decs = d.decisions.slice().sort((a,b) => a.date < b.date ? -1 : 1);
  const act = decs.filter(v => v.status === "active").reverse();
  const ret = decs.filter(v => v.status !== "active");
  const sup = ret.filter(v => v.status === "superseded").length, clo = ret.length - sup;
  const DSHOW = 5;
  let pDec = `<div class="kick"><span class="lbl">R3</span>${l.dec}<span class="src">${l.srcDec}</span><span class="r">${decs.length} ${l.logged}</span></div>`;
  if(!decs.length) pDec += `<div class="emptyline" style="margin-top:12px">${l.emptyDec}</div>`;
  else {
    pDec += `<div class="blead"><b class="hn hn-m num">${act.length}</b>
        <span><span class="t">${l.rulingsInForce}</span>
        <span class="s">${l.newestFirst} · ${ret.length} ${l.retiredWord} (${clo} ${l.closedWord}, ${sup} ${l.supersededWord})</span></span></div>
      <ul class="dlist">${act.slice(0,DSHOW).map(v => `<li>
        <span class="d-dt num">${md(v.date)}</span>
        <span><span class="d-t">${esc(v.title)}</span>
          ${v.supersedes?`<em class="d-sup">${l.replaces} ${esc(v.supersedes)}</em>`:""}</span>
        <span class="d-l">${(v.lane==="personal"?l.personal:l[v.lane]||v.lane)}</span></li>`).join("")}</ul>
      ${act.length>DSHOW?`<div class="more">+${act.length-DSHOW} ${l.moreActive}</div>`:""}
      ${ret.length?`<div class="retired">${l.retiredLabel} ${ret.map(v=>`<s>${esc(v.title)}</s>`).join("<i>·</i>")}</div>`:""}`;
  }
  $("#p-dec").innerHTML = pDec;
}

/* ======================= Assembly ======================= */
function renderAll(){
  const l = L();
  $("#ttl").textContent = l.deck;
  $("#biz").textContent = SETUP.business.name;
  /* A deck read from a bookmark, outside any session, must say
     when it is looking at yesterday's numbers rather than let them read as today's. */
  const genDay = (DATA().meta.generatedDate || DATA().meta.generated || "").slice(0,10);
  const nowDay = new Date().toISOString().slice(0,10);
  const stale = genDay && nowDay > genDay;
  $("#stamp").innerHTML = esc(l.genat + " " + DATA().meta.generated)
    + (stale ? `<span class="nudge">${esc(l.staleNudge)}</span>` : "");
  $("#stamp").classList.toggle("stale", !!stale);
  /* What the scan actually saw. A project whose Brief will not parse still ships
     here at every default, and a task note whose frontmatter never closes does
     not reach the page at all: without this count the second kind of file is
     invisible from the page itself, which is the one failure an owner could
     never spot by reading it. The build prints the same numbers once, into a
     terminal that scrolls away; the page keeps them. */
  const m = DATA().meta;
  $("#counts").innerHTML =
    `${m.briefs} ${l.cBriefs} · ${m.tasks} ${l.cTasks} · ${m.scanned} ${l.cScanned}`
    + (m.unreadable ? `<span class="warn">${m.unreadable} ${l.cUnreadable}</span>` : "");
  document.querySelector(".split").classList.toggle("norail", !S.showRail);
  $("#railbtn").innerHTML = `<span class="gl2"><i></i><i></i></span>${l.sidebar}`;
  $("#railbtn").dataset.on = S.showRail ? 1 : 0;
  $("#pendh").textContent = l.pendH; $("#pendb").textContent = l.pendBody;
  $("#pendcopy").textContent = l.pendCopy; $("#pendclear").textContent = l.pendClear;
  $("#pendclose").textContent = l.pendClose;
  renderTop(); renderTabs(); renderControls(); renderView(); renderPending(); renderCockpit();
}

$("#railbtn").onclick = () => {
  S.showRail = !S.showRail;
  document.querySelector(".split").classList.toggle("norail", !S.showRail);
  $("#railbtn").dataset.on = S.showRail ? 1 : 0;
  const t0 = performance.now();
  (function tick(){ drawEdges(); if(performance.now() - t0 < 480) requestAnimationFrame(tick); })();
};
$("#pendclose").onclick = () => $("#pendov").classList.remove("on");
$("#pendcopy").onclick = () => { $("#pendtext").select(); document.execCommand("copy"); };
$("#pendclear").onclick = () => { PENDING.length = 0; $("#pendov").classList.remove("on"); renderPending(); };
$("#pendov").onclick = e => { if(e.target.id === "pendov") $("#pendov").classList.remove("on"); };
document.addEventListener("click", e => {
  if(!e.target.closest(".menuwrap") && S.openMenu){ S.openMenu = null; renderControls(); }
  if(!e.target.closest(".tcard")) document.querySelectorAll(".tcard.open").forEach(o => o.classList.remove("open"));
});
window.addEventListener("resize", drawEdges);
window.addEventListener("load", () => setTimeout(drawEdges, 40));
renderAll();
</script>
