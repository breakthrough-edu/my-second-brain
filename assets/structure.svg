<svg viewBox="0 0 1600 880" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6600" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF6600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="880" rx="28" fill="#0B0B0E"/>
  <ellipse cx="800" cy="440" rx="720" ry="400" fill="url(#glow)"/>

  <text x="800" y="92" text-anchor="middle" font-size="34" font-weight="600" letter-spacing="8" fill="#F2F2F4">ONE VAULT, TWO WINGS</text>
  <text x="800" y="134" text-anchor="middle" font-size="19" fill="#8A8A93">two sorting logics, kept apart on purpose</text>

  <!-- Left card: personal wing -->
  <rect x="80" y="190" width="430" height="500" rx="18" fill="#131318" stroke="#2A2A32" stroke-width="1"/>
  <text x="112" y="248" font-size="24" font-weight="600" fill="#F2F2F4">YOUR LIFE</text>
  <text x="112" y="280" font-size="16" fill="#FF9A5C">03_Personal-Wing · sorted by area of life</text>

  <text x="112" y="348" font-size="20" fill="#E8E8EC" font-family="Menlo, monospace">Personal-Projects</text>
  <text x="112" y="374" font-size="15" fill="#85858E">what you are pushing right now</text>

  <text x="112" y="452" font-size="20" fill="#E8E8EC">Six life rooms</text>
  <text x="112" y="484" font-size="16" fill="#C8C8D0" font-family="Menlo, monospace">Family · Health · Finance-Personal</text>
  <text x="112" y="510" font-size="16" fill="#C8C8D0" font-family="Menlo, monospace">Property · Vehicles · People</text>
  <text x="112" y="546" font-size="15" fill="#85858E">the standing parts of a life, always</text>
  <text x="112" y="568" font-size="15" fill="#85858E">created, never asked about at setup</text>

  <!-- Center column: shared spine -->
  <rect x="580" y="190" width="440" height="230" rx="18" fill="#131318" stroke="#2A2A32" stroke-width="1"/>
  <text x="612" y="248" font-size="20" font-weight="600" fill="#F2F2F4" font-family="Menlo, monospace">02_Command-Base</text>
  <text x="612" y="280" font-size="16" fill="#FF9A5C">the operator's desk, above both wings</text>
  <text x="612" y="322" font-size="16" fill="#9A9AA3">Home is the vault's full directory</text>
  <text x="612" y="350" font-size="16" fill="#9A9AA3">Decisions · Reviews · live dashboard</text>

  <rect x="580" y="450" width="440" height="240" rx="18" fill="#131318" stroke="#2A2A32" stroke-width="1"/>
  <text x="612" y="508" font-size="18" font-weight="600" fill="#F2F2F4" font-family="Menlo, monospace">00_Inbox · 01_Daily · 98_Archive</text>
  <text x="612" y="540" font-size="16" fill="#FF9A5C">shared by both wings</text>
  <text x="612" y="582" font-size="16" fill="#9A9AA3">capture lands in the Inbox, the day is</text>
  <text x="612" y="610" font-size="16" fill="#9A9AA3">compiled at day end, and retired</text>
  <text x="612" y="638" font-size="16" fill="#9A9AA3">things go to the Archive</text>

  <!-- Right card: business wing -->
  <rect x="1090" y="190" width="430" height="500" rx="18" fill="#131318" stroke="#2A2A32" stroke-width="1"/>
  <text x="1122" y="248" font-size="24" font-weight="600" fill="#F2F2F4">YOUR BUSINESS</text>
  <text x="1122" y="280" font-size="15" fill="#FF9A5C">04_&lt;Your-Business&gt;-Business-Wing · four layers</text>

  <text x="1122" y="336" font-size="20" fill="#E8E8EC" font-family="Menlo, monospace">01_Assets</text>
  <text x="1122" y="360" font-size="15" fill="#85858E">what it is made of: clients,</text>
  <text x="1122" y="380" font-size="15" fill="#85858E">vendors, employees, systems</text>

  <text x="1122" y="428" font-size="20" fill="#E8E8EC" font-family="Menlo, monospace">02_Work</text>
  <text x="1122" y="452" font-size="15" fill="#85858E">what is moving, in four lanes:</text>
  <text x="1122" y="472" font-size="15" fill="#85858E">deliver · grow · run · build</text>

  <text x="1122" y="520" font-size="20" fill="#E8E8EC" font-family="Menlo, monospace">03_SOP</text>
  <text x="1122" y="544" font-size="15" fill="#85858E">how things get done, one</text>
  <text x="1122" y="564" font-size="15" fill="#85858E">process one note, ships empty</text>

  <rect x="1106" y="590" width="4" height="78" rx="2" fill="#FF6600"/>
  <text x="1122" y="612" font-size="20" fill="#FF7A26" font-family="Menlo, monospace">04_Methodology</text>
  <text x="1122" y="636" font-size="15" fill="#B08668">why you decide the way you do,</text>
  <text x="1122" y="656" font-size="15" fill="#B08668">fills from reviewed judgment only</text>

  <!-- Constitution bar -->
  <rect x="80" y="730" width="1440" height="94" rx="16" fill="#FF6600" fill-opacity="0.06" stroke="#FF6600" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="800" y="770" text-anchor="middle" font-size="20" fill="#FFB27D" font-family="Menlo, monospace">99_Meta/structure-doctrine.md</text>
  <text x="800" y="800" text-anchor="middle" font-size="15" fill="#9A9AA3">the written constitution both wings obey: the filing decision tree, the precedent table, the iron laws, the record schema</text>
</svg>
