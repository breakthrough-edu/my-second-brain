<svg viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="hrglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF6600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="780" rx="28" fill="#0B0B0E"/>
  <ellipse cx="800" cy="390" rx="720" ry="340" fill="url(#hrglow)"/>

  <text x="800" y="72" text-anchor="middle" font-size="30" font-weight="600" letter-spacing="7" fill="#F2F2F4">THE WEEKLY HARVEST, AS YOU SEE IT</text>
  <text x="800" y="110" text-anchor="middle" font-size="18" fill="#8A8A93">most weeks, nothing. otherwise one line in your morning brief, and a note already written</text>

  <!-- What actually reaches you: one line in the brief -->
  <text x="252" y="158" font-size="12" letter-spacing="3" fill="#6A6A74">IN YOUR MORNING BRIEF</text>
  <rect x="230" y="172" width="1140" height="66" rx="14" fill="#131318" stroke="#3A3A44" stroke-width="1"/>
  <text x="266" y="213" font-size="18" fill="#E8E8EC">"Two things from last week look worth keeping, and one memory line looks stale. Want them?"</text>

  <!-- The note it wrote for you -->
  <rect x="230" y="266" width="1140" height="434" rx="18" fill="#131318" stroke="#2A2A32" stroke-width="1"/>

  <text x="270" y="312" font-size="17" fill="#FFB27D" font-family="Menlo, monospace">00_Inbox/2026-03-08-memory-proposals.md</text>
  <rect x="1150" y="288" width="180" height="30" rx="15" fill="none" stroke="#7A7A85" stroke-width="1"/>
  <text x="1240" y="308" text-anchor="middle" font-size="12" letter-spacing="2" fill="#A9A9B2">SAMPLE · FAKE DATA</text>
  <line x1="270" y1="336" x2="1330" y2="336" stroke="#2A2A32" stroke-width="1"/>

  <!-- Proposal 1: keep -->
  <rect x="280" y="362" width="26" height="26" rx="6" fill="#FF6600" fill-opacity="0.14" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.5"/>
  <path d="M 286 375 l 6 7 l 12 -14" fill="none" stroke="#FF9A5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="372" font-size="12" letter-spacing="2" fill="#FF9A5C">KEEP · FEEDBACK</text>
  <text x="330" y="399" font-size="17" fill="#E8E8EC">Rush orders under 48 hours get declined unless a deposit clears first.</text>
  <text x="330" y="425" font-size="13" fill="#6A6A74" font-family="Menlo, monospace">from: pricing a rush wedding order · Tue 21:40</text>

  <!-- Proposal 2: keep -->
  <rect x="280" y="458" width="26" height="26" rx="6" fill="#FF6600" fill-opacity="0.14" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.5"/>
  <path d="M 286 471 l 6 7 l 12 -14" fill="none" stroke="#FF9A5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="468" font-size="12" letter-spacing="2" fill="#FF9A5C">KEEP · DECISION</text>
  <text x="330" y="495" font-size="17" fill="#E8E8EC">Dropped the entry-level package: margin sat below 20% for three straight months.</text>
  <text x="330" y="521" font-size="13" fill="#6A6A74" font-family="Menlo, monospace">from: package pricing review · Wed 15:12</text>

  <!-- Proposal 3: retire, the half nobody builds -->
  <rect x="280" y="554" width="26" height="26" rx="6" fill="none" stroke="#7A7A85" stroke-width="1.5"/>
  <line x1="287" y1="567" x2="299" y2="567" stroke="#A9A9B2" stroke-width="2.5" stroke-linecap="round"/>
  <text x="330" y="564" font-size="12" letter-spacing="2" fill="#A9A9B2">RETIRE · GONE STALE</text>
  <text x="330" y="591" font-size="17" fill="#E8E8EC">Drop "corporate tier is blocked on the new delivery van." The van arrived three weeks ago.</text>
  <text x="330" y="617" font-size="13" fill="#6A6A74" font-family="Menlo, monospace">from: your standing memory, written 14 Feb</text>

  <!-- Footer: the contract -->
  <line x1="270" y1="640" x2="1330" y2="640" stroke="#2A2A32" stroke-width="1"/>
  <text x="800" y="672" text-anchor="middle" font-size="14" fill="#8A8A93">9 conversations read for you, 3 proposals written, each with a pointer back to where it came from</text>
  <text x="800" y="744" text-anchor="middle" font-size="15" fill="#FF9A5C">the machine's sift never enters your vault · you approve the exact words, or nothing happens</text>
</svg>
