  <line x1="270" y1="630" x2="1330" y2="630" stroke="#2A2A32" stroke-width="1"/>
  <text x="800" y="664" text-anchor="middle" font-size="14" fill="#8A8A93">6 sessions read, 3 candidates survived the sift, each with a pointer to the conversation it came from</text>
  <text x="800" y="694" text-anchor="middle" font-size="15" fill="#FF9A5C">nothing is saved until you tick it · committing the report is what marks those sessions reviewed</text>
