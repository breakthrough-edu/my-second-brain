<svg viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="hrglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF6600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="780" rx="28" fill="#0B0B0E"/>
  <ellipse cx="800" cy="390" rx="720" ry="340" fill="url(#hrglow)"/>

  <text x="800" y="78" text-anchor="middle" font-size="30" font-weight="600" letter-spacing="7" fill="#F2F2F4">THE WEEKLY HARVEST REPORT</text>
  <text x="800" y="116" text-anchor="middle" font-size="18" fill="#8A8A93">what session memory drops into your Inbox, once a week</text>

  <!-- The report document -->
  <rect x="230" y="160" width="1140" height="560" rx="18" fill="#131318" stroke="#2A2A32" stroke-width="1"/>

  <text x="270" y="212" font-size="17" fill="#FFB27D" font-family="Menlo, monospace">00_Inbox/2026-03-08-harvest-report.md</text>
  <rect x="1150" y="186" width="180" height="30" rx="15" fill="none" stroke="#7A7A85" stroke-width="1"/>
  <text x="1240" y="206" text-anchor="middle" font-size="12" letter-spacing="2" fill="#A9A9B2">SAMPLE · FAKE DATA</text>
  <line x1="270" y1="242" x2="1330" y2="242" stroke="#2A2A32" stroke-width="1"/>

  <!-- Candidate 1: ticked -->
  <rect x="280" y="272" width="26" height="26" rx="6" fill="#FF6600" fill-opacity="0.14" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.5"/>
  <path d="M 286 285 l 6 7 l 12 -14" fill="none" stroke="#FF9A5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="282" font-size="12" letter-spacing="2" fill="#FF9A5C">WORTH REMEMBERING</text>
  <text x="330" y="309" font-size="17" fill="#E8E8EC">Rush orders under 48 hours get declined unless a deposit clears first.</text>
  <text x="330" y="335" font-size="13" fill="#6A6A74" font-family="Menlo, monospace">from: pricing a rush wedding order · Tue 21:40</text>

  <!-- Candidate 2: ticked -->
  <rect x="280" y="402" width="26" height="26" rx="6" fill="#FF6600" fill-opacity="0.14" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.5"/>
  <path d="M 286 415 l 6 7 l 12 -14" fill="none" stroke="#FF9A5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="412" font-size="12" letter-spacing="2" fill="#FF9A5C">DECISION WORTH LOGGING</text>
  <text x="330" y="439" font-size="17" fill="#E8E8EC">Dropped the entry-level package: margin sat below 20% for three straight months.</text>
  <text x="330" y="465" font-size="13" fill="#6A6A74" font-family="Menlo, monospace">from: package pricing review · Wed 15:12</text>

