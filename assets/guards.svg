<svg viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="guardglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF6600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6600" stop-opacity="0"/>
    </radialGradient>
    <marker id="garrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6A6A74"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="620" rx="28" fill="#0B0B0E"/>
  <ellipse cx="800" cy="300" rx="720" ry="300" fill="url(#guardglow)"/>

  <text x="800" y="78" text-anchor="middle" font-size="30" font-weight="600" letter-spacing="7" fill="#F2F2F4">MACHINES STAND GUARD</text>
  <text x="800" y="116" text-anchor="middle" font-size="18" fill="#8A8A93">written rules die without enforcement · three guards ship with the skill</text>

  <!-- Guard 1: the inspector -->
  <text x="300" y="196" text-anchor="middle" font-size="12" letter-spacing="3" fill="#6A6A74">IT FINDS</text>
  <rect x="120" y="210" width="360" height="130" rx="16" fill="#131318" stroke="#2A2A32" stroke-width="1"/>
  <text x="300" y="262" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="2" fill="#E8E8EC">THE INSPECTOR</text>
  <text x="300" y="294" text-anchor="middle" font-size="14" fill="#85858E">a read-only sweep of the whole vault,</text>
  <text x="300" y="316" text-anchor="middle" font-size="14" fill="#85858E">before every weekly tidy</text>

  <!-- Guard 2: the safety lock -->
  <text x="800" y="196" text-anchor="middle" font-size="12" letter-spacing="3" fill="#6A6A74">IT BLOCKS</text>
  <rect x="620" y="210" width="360" height="130" rx="16" fill="#131318" stroke="#2A2A32" stroke-width="1"/>
  <text x="800" y="262" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="2" fill="#E8E8EC">THE SAFETY LOCK</text>
  <text x="800" y="294" text-anchor="middle" font-size="14" fill="#85858E">stops recursive deletes aimed at your vault,</text>
  <text x="800" y="316" text-anchor="middle" font-size="14" fill="#85858E">the one accident with no undo</text>

  <!-- Guard 3: the draft firewall -->
  <text x="1300" y="196" text-anchor="middle" font-size="12" letter-spacing="3" fill="#6A6A74">IT DRAFTS</text>
  <rect x="1120" y="210" width="360" height="130" rx="16" fill="#131318" stroke="#2A2A32" stroke-width="1"/>
  <text x="1300" y="262" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="2" fill="#E8E8EC">THE DRAFT FIREWALL</text>
  <text x="1300" y="294" text-anchor="middle" font-size="14" fill="#85858E">the machine sifts outside your vault; only</text>
  <text x="1300" y="316" text-anchor="middle" font-size="14" fill="#85858E">words you approved enter standing memory</text>

  <!-- Three posts report to one desk -->
  <path d="M 300 340 C 300 420, 620 455, 770 466" fill="none" stroke="#6A6A74" stroke-width="1.5" marker-end="url(#garrowG)"/>
  <line x1="800" y1="340" x2="800" y2="452" stroke="#6A6A74" stroke-width="1.5" marker-end="url(#garrowG)"/>
  <path d="M 1300 340 C 1300 420, 980 455, 830 466" fill="none" stroke="#6A6A74" stroke-width="1.5" marker-end="url(#garrowG)"/>

  <!-- The desk where every guard reports -->
  <rect x="610" y="460" width="380" height="100" rx="16" fill="#131318" stroke="#FF6600" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="800" y="507" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="2" fill="#FF7A26">ONLY YOU RULE</text>
  <text x="800" y="537" text-anchor="middle" font-size="14" fill="#B08668">machines find, block, and propose; you decide</text>
</svg>
