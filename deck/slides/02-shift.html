<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 · The Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .shift { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  .head { margin-top: 60px; }
  .head .kicker { margin-bottom: 26px; }

  .shift-title {
    font-family: var(--font-display-cn);
    font-weight: 500;
    font-size: var(--fs-display);
    line-height: 1.14;
    letter-spacing: var(--track-tight);
    color: var(--ink);
  }
  .shift-title em { font-style: normal; color: var(--rust); }

  .mid {
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: 56px;
    max-width: 1560px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px 20px;
  }
  .chip {
    font-family: var(--font-body-cn);
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 12px 30px;
    white-space: nowrap;
  }
  .chip .en {
    font-family: var(--font-display-en);
    font-style: italic;
    font-size: 18px;
    margin-left: 10px;
    color: var(--ink-faint);
    opacity: 0.7;
  }

  .lead {
    font-family: var(--font-body-cn);
    font-weight: 300;
    font-size: var(--fs-lead);
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--ink-muted);
    max-width: 1320px;
  }
  .lead strong { font-weight: 500; color: var(--ink); }
  .lead em { font-style: normal; color: var(--rust); }

  .foot {
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    gap: 16px;
    font-family: var(--font-display-en);
    font-style: italic;
    font-size: 22px;
    color: var(--ink-faint);
  }
  .foot .arrow { font-family: var(--font-mono); font-style: normal; color: var(--rust); font-size: 20px; }
</style>
</head>
<body>

<div class="slide shift">

  <div class="slide-meta">
    <span>02 · AI 执行已经很便宜</span>
    <span class="counter">02 / 24</span>
  </div>

  <div class="head">
    <div class="kicker"><span class="dash"></span><span>The Thesis · The Shift</span></div>
    <h2 class="shift-title">会执行的 AI，<em>到处都是</em>了</h2>
  </div>

  <div class="mid">
    <div class="chips">
      <span class="chip">写文案<span class="en">Copy</span></span>
      <span class="chip">做表格<span class="en">Sheets</span></span>
      <span class="chip">查资料<span class="en">Research</span></span>
      <span class="chip">写代码<span class="en">Code</span></span>
      <span class="chip">翻译<span class="en">Translate</span></span>
      <span class="chip">总结<span class="en">Summarize</span></span>
    </div>

    <p class="lead">
      模型每季度都更强、更便宜。<br>
      <strong>执行</strong>，已经不是<em>瓶颈</em>了。
    </p>
  </div>

  <div class="foot">
    <span class="arrow">&rarr;</span>
    <span>So what is still hard?</span>
  </div>

</div>

</body>
</html>
