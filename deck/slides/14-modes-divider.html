<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>14 · The Four Modes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .div { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  .div .slide-meta { color: var(--ink-faint); }
  .div .slide-meta .counter { color: var(--ink-faint); }

  .div-stack {
    align-self: center;
    display: grid;
    grid-template-columns: minmax(0, 1500px);
    justify-content: start;
    gap: 44px;
    margin-top: 40px;
  }

  .part-mark {
    display: flex;
    align-items: center;
    gap: 22px;
    font-family: var(--font-mono);
    font-size: var(--fs-micro);
    letter-spacing: var(--track-loose);
    text-transform: uppercase;
    color: var(--rust);
  }
  .part-mark .num {
    font-size: 22px;
    letter-spacing: 0.1em;
    color: var(--rust);
  }
  .part-mark .line {
    display: inline-block;
    width: 96px;
    height: 1px;
    background: var(--rust);
  }

  .div-title {
    font-family: var(--font-display-cn);
    font-weight: 500;
    font-size: var(--fs-hero);
    line-height: 1.1;
    letter-spacing: var(--track-tight);
    color: var(--bg);
  }
  .div-title em { font-style: normal; color: var(--rust); }

  .div-en {
    font-family: var(--font-display-en);
    font-style: italic;
    font-weight: 400;
    font-size: var(--fs-subtitle);
    letter-spacing: 0.01em;
    color: var(--ink-faint);
  }

  .div-line {
    height: 1px;
    background: var(--rule-strong);
    opacity: 0.32;
    max-width: 1500px;
  }

  .div-lead {
    font-family: var(--font-display-cn);
    font-weight: 300;
    font-size: var(--fs-lead);
    line-height: 1.6;
    letter-spacing: 0.02em;
    color: oklch(82% 0.01 75);
  }
  .div-lead .sep { color: var(--rust); padding: 0 6px; }

  .div-foot {
    align-self: end;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 26px;
    border-top: 1px solid oklch(38% 0.01 60);
    font-family: var(--font-mono);
    font-size: var(--fs-micro);
    letter-spacing: var(--track-loose);
    text-transform: uppercase;
    color: var(--ink-faint);
  }
</style>
</head>
<body>

<div class="slide slide--dark div">

  <div class="slide-meta">
    <span>Part Three · 怎么用它</span>
    <span class="counter">14 / 24</span>
  </div>

  <div class="div-stack">

    <div class="part-mark">
      <span class="num">03</span>
      <span class="line"></span>
      <span>Part Three</span>
    </div>

    <h2 class="div-title">四种模式，<em>怎么用它</em></h2>

    <div class="div-en">The Four Modes</div>

    <div class="div-line"></div>

    <p class="div-lead">
      搭它<span class="sep">·</span>喂它<span class="sep">·</span>保它诚实<span class="sep">·</span>让它像你。
    </p>

  </div>

  <div class="div-foot">
    <span>My Second Brain · Breakthrough EDU</span>
    <span>Setup · Capture · Distill · Create</span>
  </div>

</div>

</body>
</html>
