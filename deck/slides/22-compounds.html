<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>22 · What Compounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .cp { display: grid; grid-template-rows: auto auto 1fr auto; height: 100%; gap: 30px; }
  .head { margin-top: 46px; }
  .head .kicker { margin-bottom: 16px; }
  .cp-title { font-family: var(--font-display-cn); font-weight: 500; font-size: var(--fs-title); line-height: 1.14; letter-spacing: var(--track-tight); color: var(--ink); }
  .cp-title em { font-style: normal; color: var(--rust); }

  /* the flywheel: 4 stages in a row, connected by arrows, with a loop-back rail */
  .wheel { align-self: center; width: 100%; max-width: 1680px; margin: 0 auto; }

  .loop {
    display: grid;
    grid-template-columns: 1fr 46px 1fr 46px 1fr 46px 1fr;
    align-items: stretch;
  }

  .stage {
    border: 1px solid var(--rule-strong);
    background: var(--bg);
    padding: 30px 30px 28px;
    display: flex; flex-direction: column; gap: 16px;
    min-height: 236px;
  }
  .stage--start { border-left: 4px solid var(--rust); }

  .st-head { display: flex; align-items: baseline; gap: 14px; }
  .st-num { font-family: var(--font-mono); font-size: 16px; letter-spacing: 1px; color: var(--ink-faint); }
  .st-cn { font-family: var(--font-display-cn); font-weight: 600; font-size: 40px; line-height: 1; color: var(--ink); letter-spacing: var(--track-tight); }
  .st-en { font-family: var(--font-display-en); font-style: italic; font-size: 21px; color: var(--ink-muted); }
  .st-body { font-family: var(--font-body-cn); font-size: 22px; line-height: 1.4; color: var(--ink-muted); }

  .arrow {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 30px; color: var(--rule-strong);
  }

  /* loop-back rail under the row */
  .rail { position: relative; height: 74px; margin-top: 4px; }
  .rail svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .rail-label {
    position: absolute; left: 50%; top: 30px; transform: translateX(-50%);
    background: var(--bg); padding: 0 18px;
    font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--rust);
  }

  .cp-caption {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 40px;
    padding-top: 24px; border-top: 1px solid var(--rule);
  }
  .cp-caption .line {
    font-family: var(--font-body-cn); font-size: var(--fs-caption); line-height: 1.5; color: var(--ink-muted);
  }
  .cp-caption .line strong { color: var(--ink); font-weight: 500; }
  .cp-caption .pull {
    font-family: var(--font-display-en); font-style: italic; font-size: 26px;
    color: var(--rust); white-space: nowrap; justify-self: end;
  }
</style>
</head>
<body>

<div class="slide cp">

  <div class="slide-meta">
    <span>22 · 会复利的那部分</span>
    <span class="counter">22 / 24</span>
  </div>

  <div class="head">
    <div class="kicker"><span class="dash"></span><span>The Payoff · What Compounds</span></div>
    <h2 class="cp-title">搭一次，然后<em>喂它一辈子</em></h2>
  </div>

  <div class="wheel">
    <div class="loop">

      <div class="stage stage--start">
        <div class="st-head">
          <span class="st-num">01</span>
          <span class="st-cn">捕捉</span>
        </div>
        <div class="st-en">Capture</div>
        <div class="st-body">随手说一句，它先接住。</div>
      </div>

      <div class="arrow">→</div>

      <div class="stage">
        <div class="st-head">
          <span class="st-num">02</span>
          <span class="st-cn">归位</span>
        </div>
        <div class="st-en">File</div>
        <div class="st-body">按规矩归好位，不再翻找。</div>
      </div>

      <div class="arrow">→</div>

      <div class="stage">
        <div class="st-head">
          <span class="st-num">03</span>
          <span class="st-cn">连线</span>
        </div>
        <div class="st-en">Link · MOC</div>
        <div class="st-body">笔记之间牵上线，长出地图。</div>
      </div>

      <div class="arrow">→</div>

      <div class="stage">
        <div class="st-head">
          <span class="st-num">04</span>
          <span class="st-cn">找 context</span>
        </div>
        <div class="st-en">Faster context</div>
        <div class="st-body">下个 session，找 context 更快。</div>
      </div>

    </div>

    <div class="rail">
      <svg viewBox="0 0 1680 74" preserveAspectRatio="none" role="img" aria-label="Loop back to Capture">
        <defs>
          <marker id="loopah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
            <path d="M0,0 L9,4 L0,8 Z" fill="var(--rust)"/>
          </marker>
        </defs>
        <path d="M 1560 4 L 1560 46 L 120 46 L 120 12"
              fill="none" stroke="var(--rust)" stroke-width="1.5"
              marker-end="url(#loopah)"/>
      </svg>
      <span class="rail-label">回到捕捉 · loops back</span>
    </div>
  </div>

  <div class="cp-caption">
    <div class="line">
      前 5 步是<strong>搭建</strong>（约 3-4 小时）；之后是<strong>养</strong>，永远不结束。<br>
      越喂越懂你；越懂你，越值得喂。
    </div>
    <div class="pull">Build it once; grow it forever.</div>
  </div>

</div>

</body>
</html>
