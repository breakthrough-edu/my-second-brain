<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>18 · Distill Pipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .dp { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 30px; }
  .head { margin-top: 46px; }
  .head .kicker { margin-bottom: 16px; }
  .dp-title { font-family: var(--font-display-cn); font-weight: 500; font-size: var(--fs-title); line-height: 1.14; letter-spacing: var(--track-tight); color: var(--ink); }
  .dp-title em { font-style: normal; color: var(--rust); }

  .diagram { align-self: center; width: 100%; max-width: 1680px; margin: 0 auto; }
  .diagram svg { width: 100%; height: auto; display: block; }

  .s-col   { font-family: var(--font-mono); font-size: 15px; letter-spacing: 2px; fill: var(--ink-faint); text-transform: uppercase; }
  .s-src   { font-family: var(--font-display-cn); font-weight: 600; font-size: 30px; fill: var(--ink); }
  .s-sub   { font-family: var(--font-body-cn); font-size: 19px; fill: var(--ink-muted); }
  .s-verb  { font-family: var(--font-body-cn); font-size: 21px; fill: var(--rust); }
  .s-out   { font-family: var(--font-display-cn); font-weight: 600; font-size: 30px; fill: var(--ink); }
  .s-oen   { font-family: var(--font-display-en); font-style: italic; font-size: 19px; fill: var(--ink-muted); }

  .dp-caption {
    font-family: var(--font-body-cn); font-size: var(--fs-caption); line-height: 1.55;
    color: var(--ink-muted); max-width: 1560px; padding-top: 24px; border-top: 1px solid var(--rule);
  }
  .dp-caption strong { color: var(--ink); font-weight: 500; }
  .dp-caption em { font-style: italic; font-family: var(--font-display-en); color: var(--rust); }
</style>
</head>
<body>

<div class="slide dp">

  <div class="slide-meta">
    <span>18 · 每周蒸馏 · 三条管道</span>
    <span class="counter">18 / 24</span>
  </div>

  <div class="head">
    <div class="kicker"><span class="dash"></span><span>Distill Mode · Three Pipes</span></div>
    <h2 class="dp-title">每周蒸馏：三条管道，通向<em>认知层</em></h2>
  </div>

  <div class="diagram">
    <svg viewBox="0 0 1680 520" role="img" aria-label="Three distillation pipes feeding Layer 3 Methodology">
      <defs>
        <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
          <path d="M0,0 L9,4 L0,8 Z" fill="var(--rust)"/>
        </marker>
      </defs>

      <!-- column headers -->
      <text class="s-col" x="30"   y="24">原料 · RAW</text>
      <text class="s-col" x="840"  y="24" text-anchor="middle">蒸馏 · DISTILL</text>
      <text class="s-col" x="1650" y="24" text-anchor="end">03 认知 · METHODOLOGY</text>

      <!-- row centers: 150, 300, 450 ; box tops: 92, 242, 392 (h=116) -->

      <!-- PIPE 1 -->
      <rect x="20"   y="92"  width="380" height="116" rx="2" fill="var(--bg)" stroke="var(--rule-strong)"/>
      <text class="s-src" x="48" y="140">决策记录</text>
      <text class="s-sub" x="48" y="176">近 10-20 条 · Decisions</text>
      <line x1="410" y1="150" x2="1268" y2="150" stroke="var(--rust)" stroke-width="1.5" marker-end="url(#ah)"/>
      <text class="s-verb" x="840" y="138" text-anchor="middle">找出重复出现的那一手</text>
      <rect x="1280" y="92"  width="380" height="116" rx="2" fill="var(--rust-soft)" stroke="var(--rust)"/>
      <text class="s-out" x="1308" y="140">决策规则</text>
      <text class="s-oen" x="1308" y="176">Decision-Rules</text>

      <!-- PIPE 2 -->
      <rect x="20"   y="242" width="380" height="116" rx="2" fill="var(--bg)" stroke="var(--rule-strong)"/>
      <text class="s-src" x="48" y="290">日志流水</text>
      <text class="s-sub" x="48" y="326">这一周 · Daily + Action</text>
      <line x1="410" y1="300" x2="1268" y2="300" stroke="var(--rust)" stroke-width="1.5" marker-end="url(#ah)"/>
      <text class="s-verb" x="840" y="288" text-anchor="middle">压缩成每周 rollup</text>
      <rect x="1280" y="242" width="380" height="116" rx="2" fill="var(--rust-soft)" stroke="var(--rust)"/>
      <text class="s-out" x="1308" y="290">周报 + 刷新地图</text>
      <text class="s-oen" x="1308" y="326">Rollup + Maps</text>

      <!-- PIPE 3 -->
      <rect x="20"   y="392" width="380" height="116" rx="2" fill="var(--bg)" stroke="var(--rule-strong)"/>
      <text class="s-src" x="48" y="440">学习 + 踩坑</text>
      <text class="s-sub" x="48" y="476">读过的 / 撞过的</text>
      <line x1="410" y1="450" x2="1268" y2="450" stroke="var(--rust)" stroke-width="1.5" marker-end="url(#ah)"/>
      <text class="s-verb" x="840" y="438" text-anchor="middle">挑出真被用过 / 真踩过的</text>
      <rect x="1280" y="392" width="380" height="116" rx="2" fill="var(--rust-soft)" stroke="var(--rust)"/>
      <text class="s-out" x="1308" y="440">教训</text>
      <text class="s-oen" x="1308" y="476">Lessons</text>
    </svg>
  </div>

  <p class="dp-caption">
    先花几分钟<strong>扫一遍</strong>（孤儿笔记、错位、过期地图，五项体检），再走这三条管道。全程<strong>你只裁 yes / no</strong>：
    <em>Distillation proposes, judgment rules.</em>
  </p>

</div>

</body>
</html>
