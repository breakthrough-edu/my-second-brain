<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 · Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .cover { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  .cover-stack {
    align-self: start;
    margin-top: 150px;
    display: grid;
    grid-template-columns: minmax(0, 1400px);
    justify-content: start;
    gap: 48px;
  }

  .cover-kicker {
    font-family: var(--font-mono);
    font-size: var(--fs-micro);
    letter-spacing: var(--track-loose);
    text-transform: uppercase;
    color: var(--rust);
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .cover-kicker::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule-strong);
    max-width: 320px;
  }

  .cover-title {
    font-family: var(--font-display-cn);
    font-weight: 500;
    font-size: var(--fs-hero);
    line-height: 1.14;
    letter-spacing: var(--track-tight);
    color: var(--ink);
  }
  .cover-title em { font-style: normal; color: var(--rust); }

  .cover-subtitle {
    font-family: var(--font-body-cn);
    font-weight: 300;
    font-size: var(--fs-subtitle);
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--ink-muted);
    max-width: 1240px;
  }
  .cover-subtitle em {
    font-style: italic;
    font-family: var(--font-display-en);
    font-weight: 400;
    color: var(--ink);
  }

  .cover-footer {
    display: grid;
    grid-template-columns: auto auto auto 1fr auto;
    align-items: end;
    gap: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
  }
  .cover-footer .label {
    font-family: var(--font-mono);
    font-size: var(--fs-micro);
    letter-spacing: var(--track-loose);
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .cover-footer .value {
    font-family: var(--font-display-en);
    font-style: italic;
    font-size: 22px;
    color: var(--ink);
  }
  .cover-footer .counter {
    font-family: var(--font-mono);
    font-size: var(--fs-micro);
    letter-spacing: var(--track-loose);
    color: var(--ink-faint);
  }
  .pair { display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>

<div class="slide cover">

  <div class="slide-meta">
    <span>My Second Brain · Breakthrough EDU</span>
    <span class="counter">01 / 24</span>
  </div>

  <div class="cover-stack">
    <div class="cover-kicker">
      <span>My Second Brain · A Claude Code Skill</span>
    </div>

    <h1 class="cover-title">
      让任何 AI，<br>
      都<em>接得住</em>你的生意。
    </h1>

    <p class="cover-subtitle">
      AI 执行已经很便宜。真正稀缺的，是<em>你的数据有一个家</em>。
      当整个生意住进一个结构化的 vault，任何模型都能回答关于你自己的真问题。
    </p>
  </div>

  <div class="cover-footer">
    <div class="pair">
      <span class="label">By</span>
      <span class="value">Jia Wei</span>
    </div>
    <div class="pair">
      <span class="label">For</span>
      <span class="value">Business owners, not engineers</span>
    </div>
    <div class="pair">
      <span class="label">Read time</span>
      <span class="value">~12 min</span>
    </div>
    <div></div>
    <div class="pair">
      <span class="label">Format</span>
      <span class="counter">Walkthrough</span>
    </div>
  </div>

</div>

</body>
</html>
