<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>05 · Promise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .pr { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 30px; }
  .head { margin-top: 46px; }
  .head .kicker { margin-bottom: 18px; }
  .pr-title {
    font-family: var(--font-display-cn); font-weight: 500;
    font-size: var(--fs-display); line-height: 1.12;
    letter-spacing: var(--track-tight); color: var(--ink);
  }
  .pr-title em { font-style: normal; color: var(--rust); }

  .stage { align-self: center; width: 100%; max-width: 1560px; margin: 0 auto; }

  /* passing models: faint sequence */
  .passing {
    display: flex; align-items: center; gap: 30px;
    font-family: var(--font-display-en); font-style: italic;
    font-size: 52px; color: var(--ink-faint); line-height: 1;
  }
  .passing .sep {
    display: inline-block; width: 30px; height: 1px;
    background: var(--rule-strong); vertical-align: middle;
  }
  .passing .fading { color: var(--rule-strong); }
  .passing .tag {
    font-family: var(--font-mono); font-style: normal;
    font-size: var(--fs-micro); letter-spacing: var(--track-loose);
    text-transform: uppercase; color: var(--ink-faint);
    margin-left: 10px;
  }

  /* the constant */
  .constant {
    margin-top: 46px;
    display: flex; align-items: baseline; gap: 28px;
  }
  .constant .cn {
    font-family: var(--font-display-cn); font-weight: 600;
    font-size: 72px; line-height: 1; color: var(--ink);
    letter-spacing: var(--track-tight);
    padding-bottom: 14px;
    border-bottom: 4px solid var(--rust);
  }
  .constant .en {
    font-family: var(--font-display-en); font-style: italic;
    font-size: 34px; color: var(--rust);
  }
  .constant .note {
    font-family: var(--font-mono); font-size: var(--fs-micro);
    letter-spacing: var(--track-loose); text-transform: uppercase;
    color: var(--ink-muted); margin-left: 8px;
  }

  .lead {
    margin-top: 44px;
    font-family: var(--font-body-cn); font-weight: 300;
    font-size: var(--fs-lead); line-height: 1.55;
    color: var(--ink-muted); max-width: 1360px;
  }
  .lead strong { color: var(--ink); font-weight: 500; }

  .pr-caption {
    font-family: var(--font-body-cn); font-size: var(--fs-caption);
    line-height: 1.55; color: var(--ink-muted);
    max-width: 1560px; padding-top: 24px; border-top: 1px solid var(--rule);
  }
  .pr-caption em { font-style: italic; font-family: var(--font-display-en); color: var(--rust); }
</style>
</head>
<body>

<div class="slide pr">

  <div class="slide-meta">
    <span>05 · 唯一留下来的资产</span>
    <span class="counter">05 / 24</span>
  </div>

  <div class="head">
    <div class="kicker"><span class="dash"></span><span>The Reframe · What Stays Yours</span></div>
    <h2 class="pr-title">模型换季，<em>你的大脑留下</em></h2>
  </div>

  <div class="stage">

    <div class="passing">
      <span class="fading">GPT</span>
      <span class="sep"></span>
      <span>Claude</span>
      <span class="sep"></span>
      <span>下一个更强的</span>
      <span class="tag">models pass</span>
    </div>

    <div class="constant">
      <span class="cn">你的知识库</span>
      <span class="en">stays</span>
      <span class="note">the constant</span>
    </div>

    <p class="lead">
      模型会一个个来、一个个过去。你搭的这个<strong>结构化知识库</strong>，是唯一
      <strong>不随模型迭代而贬值</strong>的资产。它属于你。
    </p>

  </div>

  <p class="pr-caption">
    换模型、换工具，值钱的那一层始终没动过。
    <em>The one asset that does not depreciate when the model does.</em>
  </p>

</div>

</body>
</html>
