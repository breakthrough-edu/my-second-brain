<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>10 · Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .rm { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 34px; }
  .head { margin-top: 46px; }
  .head .kicker { margin-bottom: 18px; }
  .rm-title { font-family: var(--font-display-cn); font-weight: 500; font-size: var(--fs-title); line-height: 1.14; letter-spacing: var(--track-tight); color: var(--ink); }
  .rm-title em { font-style: normal; color: var(--rust); }

  .cols {
    align-self: center;
    display: grid; grid-template-columns: 1fr 1fr; gap: 44px;
    width: 100%; max-width: 1680px; margin: 0 auto;
  }

  .col {
    border: 1px solid var(--rule-strong); background: var(--bg);
    padding: 40px 44px 34px; display: flex; flex-direction: column; gap: 26px;
    min-height: 520px;
  }
  .col--fn { border-left: 4px solid var(--rust); }

  .col-head { display: flex; flex-direction: column; gap: 10px; }
  .col-name { font-family: var(--font-display-cn); font-weight: 600; font-size: 44px; line-height: 1; color: var(--ink); letter-spacing: var(--track-tight); }
  .col-name .en { font-family: var(--font-display-en); font-style: italic; font-weight: 400; font-size: 26px; color: var(--ink-muted); margin-left: 14px; }
  .col-sub { font-family: var(--font-body-cn); font-size: 24px; color: var(--ink-muted); line-height: 1.4; }
  .col--fn .col-sub { color: var(--rust); }

  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .chip {
    border: 1px solid var(--rule); background: var(--bg-soft);
    padding: 14px 18px; display: flex; flex-direction: column; gap: 3px;
  }
  .chip .cn { font-family: var(--font-body-cn); font-size: 25px; font-weight: 500; color: var(--ink); line-height: 1.2; }
  .chip .en { font-family: var(--font-display-en); font-style: italic; font-size: 18px; color: var(--ink-faint); }

  .col-foot {
    margin-top: auto; padding-top: 20px; border-top: 1px solid var(--rule);
    font-family: var(--font-body-cn); font-size: 22px; color: var(--ink-muted);
  }
  .col-foot strong { color: var(--ink); font-weight: 500; }
  .col--fn .col-foot strong { color: var(--rust); }

  .test {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    border-top: 2px solid var(--rust); padding-top: 24px;
    max-width: 1680px; margin: 0 auto; width: 100%;
    font-family: var(--font-body-cn); font-size: var(--fs-lead); color: var(--ink);
    line-height: 1.4;
  }
  .test .seg { display: flex; align-items: center; gap: 14px; }
  .test .lead { color: var(--ink-muted); }
  .test .arrow { color: var(--rust); font-family: var(--font-mono); }
  .test .dest { font-weight: 500; }
  .test .divider { display: inline-block; width: 30px; height: 1px; background: var(--rule-strong); vertical-align: middle; }
</style>
</head>
<body>

<div class="slide rm">

  <div class="slide-meta">
    <span>10 · 家当层的两种房间</span>
    <span class="counter">10 / 24</span>
  </div>

  <div class="head">
    <div class="kicker"><span class="dash"></span><span>Inside Layer 1 · Assets</span></div>
    <h2 class="rm-title">家当层：<em>实体房间</em> 与 职能房间</h2>
  </div>

  <div class="cols">

    <div class="col">
      <div class="col-head">
        <div class="col-name">实体房间<span class="en">Entity rooms</span></div>
        <div class="col-sub">关于某个人、某样东西</div>
      </div>
      <div class="chips">
        <div class="chip"><span class="cn">客户</span><span class="en">Clients</span></div>
        <div class="chip"><span class="cn">供应商</span><span class="en">Vendors</span></div>
        <div class="chip"><span class="cn">员工</span><span class="en">Employees</span></div>
        <div class="chip"><span class="cn">产品</span><span class="en">Products</span></div>
        <div class="chip"><span class="cn">文档</span><span class="en">Docs</span></div>
        <div class="chip"><span class="cn">设备</span><span class="en">Equipment</span></div>
      </div>
      <div class="col-foot">一个实体，<strong>一条笔记</strong>。</div>
    </div>

    <div class="col col--fn">
      <div class="col-head">
        <div class="col-name">职能房间<span class="en">Function rooms</span></div>
        <div class="col-sub">某个职能在用、在管</div>
      </div>
      <div class="chips">
        <div class="chip"><span class="cn">市场</span><span class="en">Marketing</span></div>
        <div class="chip"><span class="cn">销售</span><span class="en">Sales</span></div>
        <div class="chip"><span class="cn">客服</span><span class="en">CS</span></div>
        <div class="chip"><span class="cn">人事</span><span class="en">HR</span></div>
        <div class="chip"><span class="cn">财务</span><span class="en">Finance</span></div>
        <div class="chip"><span class="cn">运营</span><span class="en">Operations</span></div>
      </div>
      <div class="col-foot"><strong>材料、日志、报表</strong>的家。</div>
    </div>

  </div>

  <div class="test">
    <div class="seg">
      <span class="lead">关于某人某物</span>
      <span class="arrow">&rarr;</span>
      <span class="dest">实体房间</span>
    </div>
    <span class="divider"></span>
    <div class="seg">
      <span class="lead">某个职能在用</span>
      <span class="arrow">&rarr;</span>
      <span class="dest">职能房间</span>
    </div>
  </div>

</div>

</body>
</html>
