<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>11 · Living Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .lp { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 30px; }
  .head { margin-top: 46px; }
  .head .kicker { margin-bottom: 16px; }
  .lp-title { font-family: var(--font-display-cn); font-weight: 500; font-size: var(--fs-title); line-height: 1.14; letter-spacing: var(--track-tight); color: var(--ink); }
  .lp-title em { font-style: normal; color: var(--rust); }

  .diagram { align-self: center; width: 100%; max-width: 1680px; margin: 0 auto; }
  .diagram svg { width: 100%; height: auto; display: block; }

  /* box labels */
  .s-num  { font-family: var(--font-mono); font-size: 22px; font-weight: 500; letter-spacing: 2px; fill: var(--rule-strong); }
  .s-cn   { font-family: var(--font-display-cn); font-weight: 600; font-size: 52px; fill: var(--ink); }
  .s-en   { font-family: var(--font-display-en); font-style: italic; font-size: 26px; fill: var(--ink-muted); }
  .s-role { font-family: var(--font-body-cn); font-size: 22px; fill: var(--ink-muted); }

  /* arrow labels */
  .s-verb { font-family: var(--font-body-cn); font-size: 23px; fill: var(--rust); }
  .s-verb-ink { fill: var(--ink); }

  /* feeder node */
  .s-node { font-family: var(--font-display-cn); font-weight: 600; font-size: 25px; fill: var(--ink); }
  .s-feed { font-family: var(--font-body-cn); font-size: 19px; fill: var(--ink-muted); }

  .lp-caption {
    font-family: var(--font-body-cn); font-size: var(--fs-caption); line-height: 1.55;
    color: var(--ink-muted); max-width: 1560px; padding-top: 24px; border-top: 1px solid var(--rule);
  }
  .lp-caption strong { color: var(--ink); font-weight: 500; }
  .lp-caption em { font-style: italic; font-family: var(--font-display-en); color: var(--rust); }
</style>
</head>
<body>

<div class="slide lp">

  <div class="slide-meta">
    <span>11 · 认知层为何留空</span>
    <span class="counter">11 / 24</span>
  </div>

  <div class="head">
    <div class="kicker"><span class="dash"></span><span>The Architecture · A Living Loop</span></div>
    <h2 class="lp-title">第三层<em>故意留空</em>，它从判断里长出来</h2>
  </div>

  <div class="diagram">
    <svg viewBox="0 0 1680 620" role="img" aria-label="A living loop between SOP and Methodology, fed by decision records">
      <defs>
        <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
          <path d="M0,0 L9,4 L0,8 Z" fill="var(--rust)"/>
        </marker>
        <marker id="ah-ink" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
          <path d="M0,0 L9,4 L0,8 Z" fill="var(--ink-muted)"/>
        </marker>
      </defs>

      <!-- ============ TWO BIG BOXES ============ -->
      <!-- LEFT box: 02 SOP  (x 60..680, y 150..410) -->
      <rect x="60" y="150" width="620" height="260" rx="3" fill="var(--bg)" stroke="var(--rule-strong)" stroke-width="1.5"/>
      <text class="s-num"  x="104" y="216">02</text>
      <text class="s-cn"   x="104" y="288">SOP</text>
      <text class="s-en"   x="104" y="330">Playbook</text>
      <text class="s-role" x="104" y="372">流程 · 事情怎么做成的</text>

      <!-- RIGHT box: 03 Methodology (x 1000..1620, y 150..410) · rust focal -->
      <rect x="1000" y="150" width="620" height="260" rx="3" fill="var(--rust-soft)" stroke="var(--rust)" stroke-width="1.5"/>
      <text class="s-num"  x="1044" y="216" fill="var(--rust)">03</text>
      <text class="s-cn"   x="1044" y="288">Methodology</text>
      <text class="s-en"   x="1044" y="330">Judgment</text>
      <text class="s-role" x="1044" y="372">认知 · 你为何这样决定</text>

      <!-- ============ TOP ARROW  LEFT -> RIGHT  (distill UP) ============ -->
      <!-- runs high at y=112, clear of box tops (150) -->
      <line x1="680" y1="112" x2="988" y2="112" stroke="var(--rust)" stroke-width="1.5" marker-end="url(#ah)"/>
      <text class="s-verb" x="834" y="80"  text-anchor="middle">反复踩的同一个坑</text>
      <text class="s-verb" x="834" y="140" text-anchor="middle">提炼成 <tspan font-weight="600">教训</tspan></text>

      <!-- ============ BOTTOM ARROW  RIGHT -> LEFT  (demote DOWN) ============ -->
      <!-- runs low at y=448, clear of box bottoms (410); big vertical gap from top arrow -->
      <line x1="1000" y1="448" x2="692" y2="448" stroke="var(--ink-muted)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
      <text class="s-verb s-verb-ink" x="846" y="500" text-anchor="middle">打法成熟、每步都写得出</text>
      <text class="s-verb s-verb-ink" x="846" y="536" text-anchor="middle">降级成 <tspan font-weight="600">SOP</tspan></text>

      <!-- ============ FEEDER: 决策记录 -> RIGHT box ============ -->
      <!-- little node right of the 03 box, feeding in from the right edge -->
      <rect x="1330" y="486" width="290" height="104" rx="3" fill="var(--bg)" stroke="var(--rule-strong)" stroke-width="1.5"/>
      <text class="s-node" x="1358" y="530">决策记录</text>
      <text class="s-feed" x="1358" y="562">复盘 → 决策规则</text>
      <!-- arrow from node up into the bottom edge of the 03 box -->
      <path d="M1475,486 L1475,414" fill="none" stroke="var(--rust)" stroke-width="1.5" marker-end="url(#ah)"/>
    </svg>
  </div>

  <p class="lp-caption">
    捕捉填不满认知层。它<strong>从判断里长出来</strong>：坑踩够了才提炼成教训，打法写全了才降级成 SOP。
    <em>The third layer is a loop, not a drawer.</em>
  </p>

</div>

</body>
</html>
