<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script>
  window.DECK_MANIFEST = [
    { file: "slides/01-cover.html",          label: "Cover" },

    { file: "slides/03-scarce.html",         label: "What's Scarce" },

    { file: "slides/08-two-axes.html",       label: "Two Sorting Axes" },
    { file: "slides/09-three-layers.html",   label: "Three Layers" },
    { file: "slides/10-rooms.html",          label: "Entity vs Function Rooms" },
    { file: "slides/11-loop.html",           label: "A Living Loop" },

  ];

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #14120E;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  #stage {
    position: fixed;
    top: 50%; left: 50%;
    transform-origin: top left;
    will-change: transform;
    background: #F5F0E6;
    box-shadow: 0 20px 80px rgba(0,0,0,0.5);
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #F5F0E6; }
  .counter {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85);
    padding: 8px 16px;
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
    font-variant-numeric: tabular-nums; z-index: 100; user-select: none;
    opacity: 0.7; transition: opacity 0.2s; border: 1px solid rgba(255,255,255,0.15);
  }
  .counter:hover { opacity: 1; }
  .counter .label { color: rgba(255,255,255,0.5); margin-left: 12px; }
  .nav-zone { position: fixed; top: 0; bottom: 0; width: 15%; cursor: pointer; z-index: 50; }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center;
    font-size: 22px; opacity: 0; transition: opacity 0.2s; border: 1px solid rgba(255,255,255,0.1);
  }
  .nav-zone.left  .nav-hint { left: 24px; }
  .nav-zone.right .nav-hint { right: 24px; }
  .nav-zone:hover .nav-hint { opacity: 1; }

  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #fff; overflow: visible; height: auto; }
    #stage { position: static; transform: none !important; box-shadow: none; }
    .counter, .nav-zone { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe { width: 1920px; height: 1080px; page-break-after: always; display: block; }
  }
</style>
</head>
<body>

<div id="stage"><iframe id="frame" src="about:blank"></iframe></div>
<div class="nav-zone left"  id="navL"><div class="nav-hint">&#8249;</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">&#8250;</div></div>
<div class="counter" id="counter">1 / 1</div>
<div class="print-stack" id="printStack" style="display:none;"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const printStack = document.getElementById('printStack');
  const storageKey = 'deck-msb-' + location.pathname;
  let current = 0;

  stage.style.width = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.92;
    const x = (window.innerWidth  - W * s) / 2;
    const y = (window.innerHeight - H * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    stage.style.top = '0'; stage.style.left = '0';
  }

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    current = idx;
    frame.src = deck[idx].file;
    counter.innerHTML = `${idx + 1} / ${deck.length} <span class="label">${deck[idx].label || ''}</span>`;
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (location.hash !== '#' + (idx + 1)) history.replaceState(null, '', '#' + (idx + 1));
  }
  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); prev(); break;
      case 'Home': e.preventDefault(); show(0); break;
      case 'End':  e.preventDefault(); show(deck.length - 1); break;
      case 'p': case 'P': window.print(); break;
    }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(parseInt(m[1], 10) - 1);
  });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else try {
    const v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (_) {}
  fit();
  show(current);

  window.addEventListener('beforeprint', () => {
    printStack.innerHTML = '';
    deck.forEach(item => { const f = document.createElement('iframe'); f.src = item.file; printStack.appendChild(f); });
    printStack.style.display = 'block';
    stage.style.display = 'none';
  });
  window.addEventListener('afterprint', () => {
    printStack.innerHTML = ''; printStack.style.display = 'none'; stage.style.display = '';
  });
})();
</script>

</body>
</html>
